            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/miniupnp/miniupnpc
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/miniupnp/upnpsoap
          )
          
          # Repo root is 6 levels up from aps3e-extracted/aps3e-2.40/app/src/main/cpp
          # cpp -> main -> src -> app -> 2.40 -> aps3e-extracted -> repo_root
          set(REPO_ROOT "${CMAKE_CURRENT_SOURCE_DIR}/../../../../../..")
          
          # Ps3Dream native library (Objective-C++ bridge + platform + JIT + MVK)
          add_library(ps3dream_native STATIC
            # Bridge
            ${REPO_ROOT}/Ps3Dream/Bridge/Ps3DreamBridge.mm
            # Platform
            ${REPO_ROOT}/Ps3Dream/Platform/ios_window.cpp
            ${REPO_ROOT}/Ps3Dream/Platform/ios_cpuinfo.cpp
