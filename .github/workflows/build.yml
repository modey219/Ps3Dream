    - name: Create iOS CMakeLists
      run: "APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp\n\ncat > \"$APS3E_CPP/CMakeLists.txt\"\
        \ << 'CMAKEEOF'\ncmake_minimum_required(VERSION 3.28)\nproject(ps3dream LANGUAGES\
        \ C CXX OBJCXX)\n\nset(CMAKE_CXX_STANDARD 20)\nset(CMAKE_POSITION_INDEPENDENT_CODE\
        \ ON)\nset(CMAKE_OSX_DEPLOYMENT_TARGET 17.0)\nset(CMAKE_OSX_ARCHITECTURES\
        \ \"arm64\")\n\n# Force __API_UNAVAILABLE to empty to allow pthread_jit_write_protect_np\
        \ on iOS\nadd_definitions(-DENABLE_JIT=1 -DARCH_ARM64=1 -DUNIX_POSIX=1 -D__APPLE__=1\
        \ -DAPPLE=1)\nadd_compile_options(-march=armv8-a -stdlib=libc++)\nadd_compile_options(-Wno-multichar\
        \ -Wno-ignored-pragmas -Wno-attributes -Wno-missing-field-initializers -Wno-sign-compare\
        \ -Wno-unused-parameter -Wno-availability -Wno-deprecated-declarations -Wno-unguarded-availability-new\
        \ -Wno-error=return-type -Wno-error=old-style-cast -Wno-error=sign-compare\
        \ -Wno-error=reorder -Wno-error=overloaded-virtual -Wno-error=missing-noreturn\
        \ -Wno-error=implicit-fallthrough)\n\nset(USE_NATIVE_INSTRUCTIONS OFF CACHE\
        \ BOOL \"\" FORCE)\nset(USE_VULKAN OFF CACHE BOOL \"\" FORCE)\nset(USE_FAUDIO\
        \ OFF CACHE BOOL \"\" FORCE)\nset(USE_SDL OFF CACHE BOOL \"\" FORCE)\nset(USE_LIBEVDEV\
        \ OFF CACHE BOOL \"\" FORCE)\nset(USE_LIBUSB OFF CACHE BOOL \"\" FORCE)\n\
