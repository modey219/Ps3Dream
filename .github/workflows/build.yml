          static inline int avcodec_open2(AVCodecContext *a,const AVCodec *b,AVDictionary **c){(void)a;(void)b;(void)c;return 0;}
          static inline int avcodec_send_packet(AVCodecContext *a,const AVCodec *b){(void)a;(void)b;return 0;}
          static inline int avcodec_receive_frame(AVCodecContext *a,AVFrame *b){(void)a;(void)b;return 0;}
          static inline const AVCodec *avcodec_find_decoder(int id){(void)id;return 0;}
          static inline const AVCodec *avcodec_find_encoder(int id){(void)id;return 0;}
          static inline const AVCodec *av_codec_iterate(void **a){(void)a;return 0;}
          static inline int av_codec_is_decoder(const AVCodec *a){(void)a;return 0;}
          static inline int av_codec_is_encoder(const AVCodec *a){(void)a;return 0;}
          static inline void avcodec_free_context(AVCodecContext **a){(void)a;}
          static inline void avcodec_flush_buffers(AVCodecContext *a){(void)a;}
          static inline int avcodec_parameters_to_context(AVCodecContext *a,const AVCodecParameters *b){(void)a;(void)b;return 0;}
          static inline int avcodec_parameters_from_context(AVCodecParameters *a,const AVCodecContext *b){(void)a;(void)b;return 0;}
          static inline int avcodec_decode_video2(AVCodecContext *a,AVFrame *b,int *c,const AVPacket *d){(void)a;(void)b;(void)c;(void)d;return 0;}
          static inline int avcodec_decode_audio4(AVCodecContext *a,AVFrame *b,int *c,const AVPacket *d){(void)a;(void)b;(void)c;(void)d;return 0;}
          static inline int avcodec_encode_video2(AVCodecContext *a,AVPacket *b,const AVFrame *c,int *d){(void)a;(void)b;(void)c;(void)d;return 0;}
          static inline int avcodec_encode_audio2(AVCodecContext *a,AVPacket *b,const AVFrame *c,int *d){(void)a;(void)b;(void)c;(void)d;return 0;}
          static inline AVPacket *av_packet_alloc(void){return 0;}
          static inline void av_packet_free(AVPacket **a){(void)a;}
          static inline void av_init_packet(AVPacket *a){(void)a;}
          static inline int av_packet_ref(AVPacket *a){(void)a;return 0;}
          static inline void av_packet_unref(AVPacket *a){(void)a;}
          static inline AVFrame *av_frame_alloc(void){return 0;}
          static inline void av_frame_free(AVFrame **a){(void)a;}
          static inline void av_frame_unref(AVFrame *a){(void)a;}
          FFTYPES
          
          cat >> "$APS3E_CPP/ffmpeg_stubs/libavcodec/packet.h" << 'FFPKT'
