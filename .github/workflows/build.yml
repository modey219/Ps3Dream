        \ OFF CACHE BOOL \"\" FORCE)\n\ninclude_directories(BEFORE ${CMAKE_CURRENT_SOURCE_DIR}/ffmpeg_stubs)\n\
        \nadd_subdirectory(rpcs3 EXCLUDE_FROM_ALL)\n\nadd_library(ps3dream_bridge\
