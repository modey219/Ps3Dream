name: Build Ps3Dream iOS
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
    - name: Install build tools
      run: brew install cmake pkg-config
    - name: Clone rpcs3 core
      run: 'git clone --depth 1 --recursive https://github.com/RPCS3/rpcs3.git rpcs3_build

        ls rpcs3_build/CMakeLists.txt

        echo "rpcs3 cloned"'
    - name: Download MoltenVK
      run: 'curl -L -o MoltenVK-ios.tar "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2-rc1/MoltenVK-ios.tar"

        mkdir -p MoltenVK-build

        tar xf MoltenVK-ios.tar -C MoltenVK-build

        find MoltenVK-build -name libMoltenVK.a | head -5'
    - name: Prepare source tree
      run: "APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp\necho \"=== rpcs3_build\
        \ contents ===\"\nls rpcs3_build/ | head -10\necho \"=== APS3E rpcs3 dir ===\"\
        \nls \"$APS3E_CPP/rpcs3/\" | head -10\ncp rpcs3_build/CMakeLists.txt \"$APS3E_CPP/rpcs3/CMakeLists.txt\"\
        \nrm -rf \"$APS3E_CPP/rpcs3/rpcs3\"\ncp -r rpcs3_build/rpcs3 \"$APS3E_CPP/rpcs3/rpcs3\"\
        \ncp -rn rpcs3_build/3rdparty/* \"$APS3E_CPP/rpcs3/3rdparty/\" 2>/dev/null\
        \ || true\ncp -r rpcs3_build/buildfiles \"$APS3E_CPP/rpcs3/\" 2>/dev/null\
        \ || true\nfor d in Utilities darwin; do\n  if [ -d \"rpcs3_build/$d\" ];\
        \ then\n    cp -r \"rpcs3_build/$d\" \"$APS3E_CPP/rpcs3/\"\n    echo \"Copied\
        \ rpcs3_build/$d\"\n  fi\ndone\necho \"=== rpcs3 root ===\"\nls rpcs3_build/\
        \ | head -20\nmkdir -p \"$APS3E_CPP/rpcs3/3rdparty/libadrenotools\"\necho\
        \ \"add_library(adrenotools INTERFACE)\" > \"$APS3E_CPP/rpcs3/3rdparty/libadrenotools/CMakeLists.txt\"\
        \nmkdir -p \"$APS3E_CPP/rpcs3/3rdparty/xxHash/cmake_unofficial\"\necho 'add_library(xxhash\
        \ INTERFACE)' > \"$APS3E_CPP/rpcs3/3rdparty/xxHash/cmake_unofficial/CMakeLists.txt\"\
        \necho 'target_include_directories(xxhash INTERFACE ${CMAKE_CURRENT_SOURCE_DIR}/..)'\
        \ >> \"$APS3E_CPP/rpcs3/3rdparty/xxHash/cmake_unofficial/CMakeLists.txt\"\n\
        mkdir -p \"$APS3E_CPP/rpcs3/3rdparty/xxHash\"\ntouch \"$APS3E_CPP/rpcs3/3rdparty/xxHash/xxhash.h\"\
        \nrm -f \"$APS3E_CPP/rpcs3/buildfiles/cmake/FindZLIB.cmake\"\necho \"Deleted\
        \ rpcs3 FindZLIB.cmake\"\nmkdir -p \"$APS3E_CPP/ffmpeg_stubs/libavutil\" \"\
        $APS3E_CPP/ffmpeg_stubs/libavcodec\" \"$APS3E_CPP/ffmpeg_stubs/libavformat\"\
        \ \"$APS3E_CPP/ffmpeg_stubs/libswscale\" \"$APS3E_CPP/ffmpeg_stubs/libswresample\"\
        \necho '#pragma once' > \"$APS3E_CPP/ffmpeg_stubs/libavutil/pixfmt.h\" \n\
        echo 'enum AVPixelFormat { AV_PIX_FMT_NONE=-1, AV_PIX_FMT_YUV420P=0, AV_PIX_FMT_YUYV422=1,\
        \ AV_PIX_FMT_RGB24=2, AV_PIX_FMT_BGR24=3, AV_PIX_FMT_RGBA=26, AV_PIX_FMT_BGRA=28\
        \ };' >> \"$APS3E_CPP/ffmpeg_stubs/libavutil/pixfmt.h\" \necho '#pragma once'\
        \ > \"$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h\" \necho '#include <stdint.h>'\
        \ >> \"$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h\" \necho 'typedef void\
        \ SwsContext;' >> \"$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h\" \necho\
        \ 'enum { SWS_FAST_BILINEAR=1, SWS_BILINEAR=2, SWS_BICUBIC=4, SWS_POINT=8\
