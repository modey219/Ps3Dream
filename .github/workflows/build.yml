name: Build Ps3Dream iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install build tools
        run: brew install cmake pkg-config

      - name: Clone rpcs3 core
        run: |
          git clone --depth 1 --recursive https://github.com/RPCS3/rpcs3.git rpcs3_build
          ls rpcs3_build/CMakeLists.txt
          ls rpcs3_build/rpcs3/ | head -10
          echo "rpcs3 cloned successfully"

      - name: Download MoltenVK pre-built
        run: |
          curl -L -o MoltenVK-ios.tar \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2-rc1/MoltenVK-ios.tar"
          mkdir -p MoltenVK-build
          tar xf MoltenVK-ios.tar -C MoltenVK-build
          find MoltenVK-build -name "libMoltenVK.a" -o -name "MoltenVK.xcframework" 2>/dev/null | head -10

      - name: Prepare source tree
        run: |
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          # Verify source exists
          echo "=== rpcs3_build contents ==="
          ls rpcs3_build/ | head -10
          echo "=== APS3E rpcs3 dir ==="
          ls "$APS3E_CPP/rpcs3/" | head -10
          
          # Copy rpcs3 root CMakeLists.txt
          cp rpcs3_build/CMakeLists.txt "$APS3E_CPP/rpcs3/CMakeLists.txt"
          
          # Copy rpcs3 core source
          rm -rf "$APS3E_CPP/rpcs3/rpcs3"
          cp -r rpcs3_build/rpcs3 "$APS3E_CPP/rpcs3/rpcs3"
          
          # Also copy 3rdparty from rpcs3 if it has better structure
          cp -rn rpcs3_build/3rdparty/* "$APS3E_CPP/rpcs3/3rdparty/" 2>/dev/null || true
          
          # Patch libusb os.cmake to support iOS
          if [ -f "$APS3E_CPP/rpcs3/3rdparty/libusb/os.cmake" ]; then
            sed -i.bak 's/message(FATAL_ERROR "Unsupported platform/message(WARNING "Unsupported platform/' "$APS3E_CPP/rpcs3/3rdparty/libusb/os.cmake"
            echo "Patched libusb os.cmake to allow iOS"
          fi
          
          # Patch 3rdparty/CMakeLists.txt for iOS using Python for reliability
          THIRDPARTY="$APS3E_CPP/rpcs3/3rdparty/CMakeLists.txt"
          if [ -f "$THIRDPARTY" ]; then
            python3 -c "
import re
with open('$THIRDPARTY', 'r') as f:
    content = f.read()

# Skip libadrenotools (Android only, missing dir)
content = content.replace('add_subdirectory(libadrenotools)', '# skip libadrenotools (Android only)')
content = content.replace('add_library(3rdparty::adrenotools ALIAS adrenotools)', '# skip adrenotools alias')

# Wrap xxHash block in IOS check
content = content.replace(
    'add_subdirectory(xxHash/cmake_unofficial EXCLUDE_FROM_ALL)\n\ttarget_include_directories(xxhash INTERFACE xxHash)',
    '# xxHash skipped for iOS\n\t# add_subdirectory(xxHash/cmake_unofficial EXCLUDE_FROM_ALL)\n\t# target_include_directories(xxhash INTERFACE xxHash)'
)

# Replace OpenGL section: wrap entire block for NOT ANDROID and NOT IOS
opengl_old = '''# OpenGL

if(NOT ANDROID)

find_package(OpenGL REQUIRED OPTIONAL_COMPONENTS EGL)

add_library(3rdparty_opengl INTERFACE)
target_include_directories(3rdparty_opengl INTERFACE GL)

endif()

if (WIN32)
\tif(NOT MSVC)
\t\ttarget_link_libraries(3rdparty_opengl INTERFACE OpenGL::GL OpenGL::GLU)
\telse()
\t\ttarget_link_libraries(3rdparty_opengl INTERFACE dxgi.lib d2d1.lib dwrite.lib)
\tendif()
elseif(APPLE)
\ttarget_link_libraries(3rdparty_opengl INTERFACE OpenGL::GL OpenGL::GLU)
elseif(ANDROID)
\tmessage(STATUS \"does not use OpenGL for Android\")
else()
\ttarget_link_libraries(3rdparty_opengl INTERFACE OpenGL::GL OpenGL::GLU OpenGL::GLX)
endif()'''

opengl_new = '''# OpenGL (disabled for iOS)
if(NOT ANDROID AND NOT IOS)
find_package(OpenGL REQUIRED OPTIONAL_COMPONENTS EGL)
add_library(3rdparty_opengl INTERFACE)
target_include_directories(3rdparty_opengl INTERFACE GL)
endif()
if(NOT IOS)
if (WIN32)
\tif(NOT MSVC)
\t\ttarget_link_libraries(3rdparty_opengl INTERFACE OpenGL::GL OpenGL::GLU)
\telse()
\t\ttarget_link_libraries(3rdparty_opengl INTERFACE dxgi.lib d2d1.lib dwrite.lib)
\tendif()
elseif(APPLE)
\ttarget_link_libraries(3rdparty_opengl INTERFACE OpenGL::GL OpenGL::GLU)
elseif(ANDROID)
\tmessage(STATUS \"does not use OpenGL for Android\")
else()
\ttarget_link_libraries(3rdparty_opengl INTERFACE OpenGL::GL OpenGL::GLU OpenGL::GLX)
endif()
endif()'''

content = content.replace(opengl_old, opengl_new)

# Skip GLEW for iOS
content = content.replace('if(NOT ANDROID)\nadd_library(3rdparty_glew INTERFACE)\nendif()', 'if(NOT ANDROID AND NOT IOS)\nadd_library(3rdparty_glew INTERFACE)\nendif()')
content = content.replace('if(NOT MSVC AND NOT ANDROID)\n\tfind_package(GLEW REQUIRED)', 'if(NOT MSVC AND NOT ANDROID AND NOT IOS)\n\tfind_package(GLEW REQUIRED)')

# Skip LLVM for iOS
content = content.replace('add_subdirectory(llvm EXCLUDE_FROM_ALL)', '# LLVM skipped for iOS')

# Skip cubeb for iOS
content = content.replace('add_subdirectory(cubeb EXCLUDE_FROM_ALL)', '# cubeb skipped for iOS')

# Skip OpenAL for iOS  
content = content.replace('if(NOT ANDROID)\n    add_subdirectory(OpenAL EXCLUDE_FROM_ALL)\nendif()', 'if(NOT ANDROID AND NOT IOS)\n    add_subdirectory(OpenAL EXCLUDE_FROM_ALL)\nendif()')

# Make rtmidi conditional on not iOS
content = content.replace('if(NOT ANDROID)\n\n# RTMIDI', 'if(NOT ANDROID AND NOT IOS)\n\n# RTMIDI')

# Skip discord-rpc for iOS  
content = content.replace('add_subdirectory(discord-rpc)', '# discord-rpc skipped for iOS')
content = content.replace('add_library(3rdparty::discordRPC ALIAS 3rdparty_discordRPC)', '# skip discordRPC alias')

# Make ffmpeg conditional
content = content.replace('add_subdirectory(ffmpeg EXCLUDE_FROM_ALL)', '# ffmpeg skipped for iOS')

# Skip wolfssl, curl for iOS
content = content.replace('add_subdirectory(wolfssl EXCLUDE_FROM_ALL)', '# wolfssl skipped for iOS')
content = content.replace('add_subdirectory(curl EXCLUDE_FROM_ALL)', '# curl skipped for iOS')
content = content.replace('add_library(3rdparty::wolfssl ALIAS wolfssl)', '# skip wolfssl alias')
content = content.replace('add_library(3rdparty::libcurl ALIAS 3rdparty_libcurl)', '# skip libcurl alias')
content = content.replace('add_library(3rdparty::ffmpeg ALIAS 3rdparty_ffmpeg)', '# skip ffmpeg alias')

# Make hidapi conditional
content = content.replace('add_subdirectory(hidapi)', 'if(NOT IOS)\nadd_subdirectory(hidapi)\nendif()')
content = content.replace('add_library(3rdparty::hidapi ALIAS 3rdparty_hidapi)', 'if(NOT IOS)\nadd_library(3rdparty::hidapi ALIAS 3rdparty_hidapi)\nendif()')

with open('$THIRDPARTY', 'w') as f:
    f.write(content)
print('Patched 3rdparty/CMakeLists.txt for iOS')
"
          fi
          
          # Patch rpcs3 CMakeLists to handle iOS
          if [ -f "$APS3E_CPP/rpcs3/CMakeLists.txt" ]; then
            sed -i.bak 's/set(CMAKE_OSX_DEPLOYMENT_TARGET.*/set(CMAKE_OSX_DEPLOYMENT_TARGET "17.0")/' "$APS3E_CPP/rpcs3/CMakeLists.txt" 2>/dev/null || true
          fi
          
          echo "=== Final rpcs3 structure ==="
          ls "$APS3E_CPP/rpcs3/" | head -15
          ls "$APS3E_CPP/rpcs3/rpcs3/" | head -15

      - name: Create iOS CMakeLists
        run: |
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          cat > "$APS3E_CPP/CMakeLists.txt" << 'CMAKEEOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(ps3dream LANGUAGES C CXX OBJCXX)
          
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)
          set(CMAKE_OSX_DEPLOYMENT_TARGET 17.0)
          set(CMAKE_OSX_ARCHITECTURES "arm64")
          
          add_compile_options(-march=armv8-a -stdlib=libc++)
          add_compile_options(-Wno-multichar -Wno-ignored-pragmas -Wno-attributes -Wno-missing-field-initializers -Wno-sign-compare -Wno-unused-parameter)
          
          add_definitions(-DENABLE_JIT=1 -DARCH_ARM64=1 -DUNIX_POSIX=1 -D__APPLE__=1 -DAPPLE=1)
          
          set(USE_NATIVE_INSTRUCTIONS OFF CACHE BOOL "" FORCE)
          set(USE_VULKAN OFF CACHE BOOL "" FORCE)
          set(USE_FAUDIO OFF CACHE BOOL "" FORCE)
          set(USE_SDL OFF CACHE BOOL "" FORCE)
          set(USE_LIBEVDEV OFF CACHE BOOL "" FORCE)
          set(USE_LIBUSB OFF CACHE BOOL "" FORCE)
          set(USE_ALSA OFF CACHE BOOL "" FORCE)
          set(USE_PULSE OFF CACHE BOOL "" FORCE)
          set(USE_WOLFSSL OFF CACHE BOOL "" FORCE)
          set(USE_OPENAL OFF CACHE BOOL "" FORCE)
          set(USE_CUBEB OFF CACHE BOOL "" FORCE)
          set(USE_GLLD OFF CACHE BOOL "" FORCE)
          set(USE_FFMPEG OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_GLSLANG OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_FFMPEG OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_LIBUSB OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_CURL OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_ZLIB OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_ZSTD OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_LIBPNG OFF CACHE BOOL "" FORCE)
          set(USE_LIBUPNP OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_FFTW OFF CACHE BOOL "" FORCE)
          set(USE_LLVM OFF CACHE BOOL "" FORCE)
          set(USE_NATIVE_INSTRUCTIONS OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_LIBLZMA OFF CACHE BOOL "" FORCE)
          set(BUILD_LLVM OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_BOOST OFF CACHE BOOL "" FORCE)
          set(USE_VULKAN_MEM_ALLOC OFF CACHE BOOL "" FORCE)
          
          add_subdirectory(rpcs3 EXCLUDE_FROM_ALL)
          
          add_library(ps3dream_bridge SHARED
            aps3e_rp3_impl.cpp
            aps3e_emu.cpp
            aps3e.cpp
            vkapi.cpp
            vkutil.cpp
            cpuinfo.cpp
            glsl2spv.cpp
            meminfo.cpp
            emulator.cpp
            emulator_aps3e.cpp
            rpcs3/rpcs3/Input/raw_mouse_config.cpp
            rpcs3/rpcs3/Input/raw_mouse_handler.cpp
            rpcs3/rpcs3/Input/product_info.cpp
            rpcs3/rpcs3/rpcs3_version.cpp
            rpcs3/rpcs3/stb_image.cpp
            rpcs3/rpcs3/stdafx.cpp
          )
          
          target_include_directories(ps3dream_bridge PRIVATE
            ${CMAKE_CURRENT_SOURCE_DIR}
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/rpcs3
          )
          
          target_link_libraries(ps3dream_bridge PRIVATE rpcs3_emu)
          
          find_library(METAL Metal)
          find_library(QUARTZ_CORE QuartzCore)
          find_library(UIKIT UIKit)
          find_library(FOUNDATION Foundation)
          
          target_link_libraries(ps3dream_bridge PRIVATE
            ${METAL} ${QUARTZ_CORE} ${UIKIT} ${FOUNDATION}
            pthread
          )
          
          set(MVK_LIB "${CMAKE_CURRENT_SOURCE_DIR}/../../MoltenVK-build/Package/Libraries/iOS/libMoltenVK.a")
          if(EXISTS "${MVK_LIB}")
            target_link_libraries(ps3dream_bridge PRIVATE "${MVK_LIB}")
          endif()
          CMAKEEOF

      - name: Build emulator
        run: |
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          cd "$APS3E_CPP"
          rm -rf build_ios
          mkdir build_ios && cd build_ios
          
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -G Xcode
          
          echo "=== CMake configure done ==="
          
          cmake --build . --config Release -- \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          mkdir -p Payload/Ps3Dream.app
          
          find "$APS3E_CPP/build_ios" \( -name "*.dylib" -o -name "*.a" \) \
            -path "*/Release/*" -exec cp {} Payload/Ps3Dream.app/ \; 2>/dev/null || true
          find "$APS3E_CPP/build_ios" -name "libps3dream_bridge.dylib" -exec cp {} Payload/Ps3Dream.app/ \; 2>/dev/null || true
          find "$APS3E_CPP/build_ios" -name "*.dylib" -exec cp {} Payload/Ps3Dream.app/ \; 2>/dev/null || true
          
          cp Ps3Dream/Info.plist Payload/Ps3Dream.app/
          
          echo "=== IPA contents ==="
          ls -la Payload/Ps3Dream.app/
          
          zip -r -y Ps3Dream.ipa Payload/
          ls -lh Ps3Dream.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ps3Dream-iOS-IPA
          path: Ps3Dream.ipa
          retention-days: 30
