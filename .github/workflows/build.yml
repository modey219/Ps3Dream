          target_include_directories(ps3dream_native PRIVATE ${_3rdparty_inc_dirs})
          
          # Safety net: also pull INTERFACE_INCLUDE_DIRECTORIES directly from targets
          # that set it on themselves (not pure alias/forwarding libs), which also
          # covers generated headers under the build dir (e.g. libpng's pnglibconf.h)
          # that no fixed source-relative path could predict. if(TARGET)/if(_tgt_inc)
          # guards make this a no-op for any name that doesn't exist, so a wrong or
          # missing target name here cannot hard-fail the configure.
          foreach(_tgt yaml-cpp 3rdparty_stblib soundtouch libzstd_static asmjit SPIRV png_static 3rdparty_7zip)
            if(TARGET ${_tgt})
              get_target_property(_tgt_inc ${_tgt} INTERFACE_INCLUDE_DIRECTORIES)
              if(_tgt_inc)
                target_include_directories(rpcs3_emu PRIVATE ${_tgt_inc})
                target_include_directories(ps3dream_native PRIVATE ${_tgt_inc})
