name: Build Ps3Dream iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install build tools
        run: brew install cmake pkg-config

      - name: Clone rpcs3 core
        run: |
          git clone --depth 1 --recursive https://github.com/RPCS3/rpcs3.git rpcs3_build
          ls rpcs3_build/CMakeLists.txt
          ls rpcs3_build/rpcs3/ | head -10
          echo "rpcs3 cloned successfully"

      - name: Download MoltenVK pre-built
        run: |
          curl -L -o MoltenVK-ios.tar \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2-rc1/MoltenVK-ios.tar"
          mkdir -p MoltenVK-build
          tar xf MoltenVK-ios.tar -C MoltenVK-build
          find MoltenVK-build -name "libMoltenVK.a" -o -name "MoltenVK.xcframework" 2>/dev/null | head -10

      - name: Prepare source tree
        run: |
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          # Verify source exists
          echo "=== rpcs3_build contents ==="
          ls rpcs3_build/ | head -10
          echo "=== APS3E rpcs3 dir ==="
          ls "$APS3E_CPP/rpcs3/" | head -10
          
          # Copy rpcs3 root CMakeLists.txt
          cp rpcs3_build/CMakeLists.txt "$APS3E_CPP/rpcs3/CMakeLists.txt"
          
          # Copy rpcs3 core source
          rm -rf "$APS3E_CPP/rpcs3/rpcs3"
          cp -r rpcs3_build/rpcs3 "$APS3E_CPP/rpcs3/rpcs3"
          
          # Also copy 3rdparty from rpcs3 if it has better structure
          cp -rn rpcs3_build/3rdparty/* "$APS3E_CPP/rpcs3/3rdparty/" 2>/dev/null || true
          
          # Copy buildfiles (contains ConfigureCompiler.cmake etc.)
          cp -r rpcs3_build/buildfiles "$APS3E_CPP/rpcs3/" 2>/dev/null || true
          
          # Copy all root-level dirs that rpcs3 source may reference via relative paths
          for d in Utilities darwin; do
            if [ -d "rpcs3_build/$d" ]; then
              cp -r "rpcs3_build/$d" "$APS3E_CPP/rpcs3/"
              echo "Copied rpcs3_build/$d"
            fi
          done
          
          # List files to verify
          echo "=== rpcs3 root ==="
          ls rpcs3_build/ | head -20
          echo "=== rpcs3/rpcs3 top-level files ==="
          ls rpcs3_build/rpcs3/*.cpp 2>/dev/null | head -10
          
          # Create stub dirs for missing subdirectories that CMakeLists expects
          mkdir -p "$APS3E_CPP/rpcs3/3rdparty/libadrenotools"
          echo "add_library(adrenotools INTERFACE)" > "$APS3E_CPP/rpcs3/3rdparty/libadrenotools/CMakeLists.txt"
          
          mkdir -p "$APS3E_CPP/rpcs3/3rdparty/xxHash/cmake_unofficial"
          cat > "$APS3E_CPP/rpcs3/3rdparty/xxHash/cmake_unofficial/CMakeLists.txt" << 'EOF'
          add_library(xxhash INTERFACE)
          target_include_directories(xxhash INTERFACE ${CMAKE_CURRENT_SOURCE_DIR}/..)
          EOF
          mkdir -p "$APS3E_CPP/rpcs3/3rdparty/xxHash"
          touch "$APS3E_CPP/rpcs3/3rdparty/xxHash/xxhash.h"
          
          # Delete rpcs3's custom FindZLIB.cmake (conflicts with our ZLIB::ZLIB target)
          rm -f "$APS3E_CPP/rpcs3/buildfiles/cmake/FindZLIB.cmake"
          echo "Deleted rpcs3 FindZLIB.cmake"
          
          # Create stub ffmpeg headers (rsx_utils.h and video_provider.cpp include pixfmt.h unconditionally)
          mkdir -p "$APS3E_CPP/ffmpeg_stubs/libavutil" \
                   "$APS3E_CPP/ffmpeg_stubs/libavcodec" \
                   "$APS3E_CPP/ffmpeg_stubs/libavformat" \
                   "$APS3E_CPP/ffmpeg_stubs/libswscale" \
                   "$APS3E_CPP/ffmpeg_stubs/libswresample"
          
          echo '#pragma once' > "$APS3E_CPP/ffmpeg_stubs/libavutil/pixfmt.h"
          echo 'enum AVPixelFormat { AV_PIX_FMT_NONE=-1, AV_PIX_FMT_YUV420P=0, AV_PIX_FMT_YUYV422=1, AV_PIX_FMT_RGB24=2, AV_PIX_FMT_BGR24=3, AV_PIX_FMT_RGBA=26, AV_PIX_FMT_BGRA=28 };' >> "$APS3E_CPP/ffmpeg_stubs/libavutil/pixfmt.h"
          
          echo '#pragma once' > "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo '#include <stdint.h>' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo 'typedef void SwsContext;' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo 'enum { SWS_FAST_BILINEAR=1, SWS_BILINEAR=2, SWS_BICUBIC=4, SWS_POINT=8 };' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo 'static inline SwsContext* sws_getContext(int a,int b,int c,int d,int e,int f,int g,void *h,void *i,void *j){(void)a;(void)b;(void)c;(void)d;(void)e;(void)f;(void)g;(void)h;(void)i;(void)j;return 0;}' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo 'static inline SwsContext* sws_getCachedContext(SwsContext *c,int a,int b,int d,int e,int f,int g,int h,void *i,void *j,void *k){(void)c;(void)a;(void)b;(void)d;(void)e;(void)f;(void)g;(void)h;(void)i;(void)j;(void)k;return 0;}' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo 'static inline int sws_scale(SwsContext *c,const uint8_t *const a[],const int b[],int d,int e,uint8_t *const f[],const int g[]){(void)c;(void)a;(void)b;(void)d;(void)e;(void)f;(void)g;return 0;}' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo 'static inline void sws_freeContext(SwsContext *c){(void)c;}' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          
          echo '#pragma once' > "$APS3E_CPP/ffmpeg_stubs/libavutil/imgutils.h"
          echo '#include <stdint.h>' >> "$APS3E_CPP/ffmpeg_stubs/libavutil/imgutils.h"
          echo 'static inline int av_image_fill_linesizes(int a[],int b,int c,int d){(void)a;(void)b;(void)c;(void)d;return 0;}' >> "$APS3E_CPP/ffmpeg_stubs/libavutil/imgutils.h"
          echo 'static inline int av_image_fill_pointers(uint8_t *a[],int b,int c,uint8_t *d,const int e[]){(void)a;(void)b;(void)c;(void)d;(void)e;return 0;}' >> "$APS3E_CPP/ffmpeg_stubs/libavutil/imgutils.h"
          
          echo "Created ffmpeg stub headers"
          ls -la "$APS3E_CPP/ffmpeg_stubs/libavutil/" "$APS3E_CPP/ffmpeg_stubs/libswscale/"
          
          # Patch libusb os.cmake to support iOS
          if [ -f "$APS3E_CPP/rpcs3/3rdparty/libusb/os.cmake" ]; then
            sed -i '' 's/message(FATAL_ERROR "Unsupported platform/message(WARNING "Unsupported platform/' "$APS3E_CPP/rpcs3/3rdparty/libusb/os.cmake"
            echo "Patched libusb os.cmake to allow iOS"
          fi
          
          # Remove -Werror flags from rpcs3 CMakeLists (not valid for iOS cross-compilation)
          for f in "$APS3E_CPP/rpcs3/rpcs3/CMakeLists.txt" "$APS3E_CPP/rpcs3/Utilities/CMakeLists.txt"; do
            if [ -f "$f" ]; then
              sed -i '' 's/-Werror=return-type//g; s/-Werror=old-style-cast//g; s/-Werror=sign-compare//g; s/-Werror=reorder//g; s/-Werror=overloaded-virtual//g; s/-Werror=missing-noreturn//g; s/-Werror=implicit-fallthrough//g' "$f"
              echo "Patched $f to remove -Werror flags"
            fi
          done
          
          # Patch JIT.h to suppress pthread_jit_write_protect_np unavailability (it IS available on iOS 15+)
          if [ -f "$APS3E_CPP/rpcs3/Utilities/JIT.h" ]; then
            # Prepend macro overrides before the file so __API_UNAVAILABLE expands to nothing before pthread.h defines it
            TMPJIT=$(mktemp)
            cat > "$TMPJIT" << 'JITHACK'
          #ifdef __APPLE__
          #include <TargetConditionals.h>
          #if TARGET_OS_IPHONE
          #undef __API_UNAVAILABLE
          #define __API_UNAVAILABLE(...)
          #undef __API_UNAVAILABLE_MSG
          #define __API_UNAVAILABLE_MSG(...)
          #pragma clang diagnostic ignored "-Wunguarded-availability-new"
          #pragma clang diagnostic ignored "-Wunguarded-availability"
          #pragma clang diagnostic ignored "-Wavailability"
          #pragma clang diagnostic ignored "-Wunavailable"
          #endif
          #endif
          JITHACK
            cat "$APS3E_CPP/rpcs3/Utilities/JIT.h" >> "$TMPJIT"
            mv "$TMPJIT" "$APS3E_CPP/rpcs3/Utilities/JIT.h"
            echo "Patched JIT.h to suppress availability error"
          fi
          
          # Replace 3rdparty/CMakeLists.txt with iOS-compatible version
          THIRDPARTY="$APS3E_CPP/rpcs3/3rdparty/CMakeLists.txt"
          cp "$THIRDPARTY" "${THIRDPARTY}.bak"
          cat > "$THIRDPARTY" << 'CMAKEOF'
          cmake_minimum_required(VERSION 3.22.1)
          find_package(PkgConfig)
          include(ExternalProject)
          include(CMakeDependentOption)
          set(CMAKE_CXX_STANDARD 20)
          if(NOT MSVC)
              add_compile_options("$<$<COMPILE_LANGUAGE:CXX,C>:-w>")
          endif()
          add_library(3rdparty_dummy_lib INTERFACE)

          # ZLib (use iOS SDK zlib)
          find_package(ZLIB REQUIRED)
          add_library(3rdparty_zlib INTERFACE)
          target_link_libraries(3rdparty_zlib INTERFACE ZLIB::ZLIB)
          target_compile_definitions(3rdparty_zlib INTERFACE -DZLIB_CONST=1)

          # ZSTD
          set(ZSTD_BUILD_PROGRAMS OFF CACHE BOOL "" FORCE)
          set(ZSTD_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(ZSTD_BUILD_SHARED OFF CACHE BOOL "" FORCE)
          set(ZSTD_BUILD_STATIC ON CACHE BOOL "" FORCE)
          set(ZSTD_LEGACY_SUPPORT OFF CACHE BOOL "" FORCE)
          set(ZSTD_MULTITHREAD_SUPPORT OFF CACHE BOOL "" FORCE)
          add_subdirectory(zstd EXCLUDE_FROM_ALL)

          # 7zip sdk
          add_subdirectory(7zip EXCLUDE_FROM_ALL)

          # flatbuffers (header-only)
          add_library(3rdparty_flatbuffers INTERFACE)
          target_include_directories(3rdparty_flatbuffers INTERFACE flatbuffers/include)

          # libPNG
          set(LIBPNG_TARGET 3rdparty_libpng)
          add_subdirectory(libpng EXCLUDE_FROM_ALL)

          # pugixml
          add_subdirectory(pugixml EXCLUDE_FROM_ALL)

          # yaml-cpp
          add_subdirectory(yaml-cpp)

          # stblib
          add_subdirectory(stblib)

          # SoundTouch
          add_subdirectory(SoundTouch EXCLUDE_FROM_ALL)

          # glslang
          add_subdirectory(glslang EXCLUDE_FROM_ALL)

          # miniupnp
          add_subdirectory(miniupnp EXCLUDE_FROM_ALL)

          # AsmJit
          add_subdirectory(asmjit EXCLUDE_FROM_ALL)

          # Vulkan (disabled for iOS)
          set(VULKAN_TARGET 3rdparty_dummy_lib)

          # FAudio (disabled for iOS)
          set(FAUDIO_TARGET 3rdparty_dummy_lib)

          # SDL2 (disabled for iOS)
          set(SDL2_TARGET 3rdparty_dummy_lib)

          # libevdev (disabled for iOS)
          set(LIBEVDEV_TARGET 3rdparty_dummy_lib)

          # Stub targets for disabled deps
          add_library(xxhash INTERFACE)
          add_library(usb-1.0-static INTERFACE)
          add_library(usb-1.0-shared INTERFACE)
          add_library(adrenotools INTERFACE)
          add_library(3rdparty_ffmpeg INTERFACE)
          add_library(3rdparty_glew INTERFACE)
          add_library(3rdparty_opengl INTERFACE)
          add_library(3rdparty_openal INTERFACE)
          add_library(3rdparty_hidapi INTERFACE)
          add_library(wolfssl INTERFACE)
          add_library(3rdparty_libcurl INTERFACE)
          add_library(3rdparty_discordRPC INTERFACE)
          add_library(cubeb INTERFACE)
          add_library(rtmidi INTERFACE)
          add_library(3rdparty_llvm INTERFACE)
          add_library(3rdparty_sdl3 INTERFACE)
          add_library(3rdparty_protobuf INTERFACE)
          add_library(3rdparty_vulkanmemoryallocator INTERFACE)
          add_library(3rdparty_opencv INTERFACE)
          add_library(3rdparty_feralinteractive INTERFACE)

          # ALIAS targets
          add_library(3rdparty::zlib ALIAS 3rdparty_zlib)
          add_library(3rdparty::zstd ALIAS 3rdparty_zstd)
          add_library(3rdparty::7zip ALIAS 3rdparty_7zip)
          add_library(3rdparty::flatbuffers ALIAS 3rdparty_flatbuffers)
          add_library(3rdparty::pugixml ALIAS pugixml)
          add_library(3rdparty::yaml-cpp ALIAS yaml-cpp)
          add_library(3rdparty::stblib ALIAS 3rdparty_stblib)
          add_library(3rdparty::soundtouch ALIAS soundtouch)
          add_library(3rdparty::libpng ALIAS ${LIBPNG_TARGET})
          add_library(3rdparty::glslang ALIAS glslang)
          add_library(3rdparty::miniupnpc ALIAS 3rdparty_miniupnpc)
          add_library(3rdparty::xxhash ALIAS xxhash)
          add_library(3rdparty::libusb ALIAS usb-1.0-static)
          add_library(3rdparty::adrenotools ALIAS adrenotools)
          add_library(3rdparty::ffmpeg ALIAS 3rdparty_ffmpeg)
          add_library(3rdparty::glew ALIAS 3rdparty_glew)
          add_library(3rdparty::opengl ALIAS 3rdparty_opengl)
          add_library(3rdparty::openal ALIAS 3rdparty_openal)
          add_library(3rdparty::hidapi ALIAS 3rdparty_hidapi)
          add_library(3rdparty::wolfssl ALIAS wolfssl)
          add_library(3rdparty::libcurl ALIAS 3rdparty_libcurl)
          add_library(3rdparty::discordRPC ALIAS 3rdparty_discordRPC)
          add_library(3rdparty::cubeb ALIAS cubeb)
          add_library(3rdparty::vulkan ALIAS ${VULKAN_TARGET})
          add_library(3rdparty::faudio ALIAS ${FAUDIO_TARGET})
          add_library(3rdparty::sdl2 ALIAS ${SDL2_TARGET})
          add_library(3rdparty::sdl3 ALIAS 3rdparty_sdl3)
          add_library(3rdparty::libevdev ALIAS ${LIBEVDEV_TARGET})
          add_library(3rdparty::rtmidi ALIAS rtmidi)
          add_library(3rdparty::llvm ALIAS 3rdparty_llvm)
          add_library(3rdparty::protobuf ALIAS 3rdparty_protobuf)
          add_library(3rdparty::vulkanmemoryallocator ALIAS 3rdparty_vulkanmemoryallocator)
          add_library(3rdparty::opencv ALIAS 3rdparty_opencv)
          add_library(3rdparty::feralinteractive ALIAS 3rdparty_feralinteractive)
          CMAKEOF
          echo "Replaced 3rdparty/CMakeLists.txt with iOS-compatible version"
          wc -l "$THIRDPARTY"
          
          echo "=== Final rpcs3 structure ==="
          ls "$APS3E_CPP/rpcs3/" | head -15
          ls "$APS3E_CPP/rpcs3/rpcs3/" | head -15

      - name: Create iOS CMakeLists
        run: |
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          cat > "$APS3E_CPP/CMakeLists.txt" << 'CMAKEEOF'
          cmake_minimum_required(VERSION 3.28)
          project(ps3dream LANGUAGES C CXX OBJCXX)
          
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)
          set(CMAKE_OSX_DEPLOYMENT_TARGET 17.0)
          set(CMAKE_OSX_ARCHITECTURES "arm64")
          
          add_compile_options(-march=armv8-a -stdlib=libc++)
          add_compile_options(-Wno-multichar -Wno-ignored-pragmas -Wno-attributes -Wno-missing-field-initializers -Wno-sign-compare -Wno-unused-parameter -Wno-availability -Wno-deprecated-declarations -Wno-error=return-type -Wno-error=old-style-cast -Wno-error=sign-compare -Wno-error=reorder -Wno-error=overloaded-virtual -Wno-error=missing-noreturn -Wno-error=implicit-fallthrough)
          
          add_definitions(-DENABLE_JIT=1 -DARCH_ARM64=1 -DUNIX_POSIX=1 -D__APPLE__=1 -DAPPLE=1)
          # Suppress all warnings/errors for iOS cross-compilation
          add_compile_options(-Wno-error=unavailable -Wno-error=availability -Wno-unavailable -Wno-availability -Wno-error=return-type -Wno-error=old-style-cast -Wno-error=sign-compare -Wno-error=reorder -Wno-error=overloaded-virtual -Wno-error=missing-noreturn -Wno-error=implicit-fallthrough -Wno-error=unused-parameter -Wno-error=cast-qual -Wno-error=deprecated-copy -Wno-error=tautological-compare -Wno-error=strict-aliasing -Wno-deprecated-declarations -Wno-error=unguarded-availability-new)
          
          set(USE_NATIVE_INSTRUCTIONS OFF CACHE BOOL "" FORCE)
          set(USE_VULKAN OFF CACHE BOOL "" FORCE)
          set(USE_FAUDIO OFF CACHE BOOL "" FORCE)
          set(USE_SDL OFF CACHE BOOL "" FORCE)
          set(USE_LIBEVDEV OFF CACHE BOOL "" FORCE)
          set(USE_LIBUSB OFF CACHE BOOL "" FORCE)
          set(USE_ALSA OFF CACHE BOOL "" FORCE)
          set(USE_PULSE OFF CACHE BOOL "" FORCE)
          set(USE_WOLFSSL OFF CACHE BOOL "" FORCE)
          set(USE_OPENAL OFF CACHE BOOL "" FORCE)
          set(USE_CUBEB OFF CACHE BOOL "" FORCE)
          set(USE_GLLD OFF CACHE BOOL "" FORCE)
          set(USE_FFMPEG OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_GLSLANG OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_FFMPEG OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_LIBUSB OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_CURL OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_ZLIB OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_ZSTD OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_LIBPNG OFF CACHE BOOL "" FORCE)
          set(USE_LIBUPNP OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_FFTW OFF CACHE BOOL "" FORCE)
          set(USE_LLVM OFF CACHE BOOL "" FORCE)
          set(USE_NATIVE_INSTRUCTIONS OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_LIBLZMA OFF CACHE BOOL "" FORCE)
          set(BUILD_LLVM OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_BOOST OFF CACHE BOOL "" FORCE)
          set(USE_VULKAN_MEM_ALLOC OFF CACHE BOOL "" FORCE)
          
          include_directories(BEFORE ${CMAKE_CURRENT_SOURCE_DIR}/ffmpeg_stubs)
          
          add_subdirectory(rpcs3 EXCLUDE_FROM_ALL)
          
          add_library(ps3dream_bridge SHARED
            aps3e_rp3_impl.cpp
            aps3e_emu.cpp
            aps3e.cpp
            vkapi.cpp
            vkutil.cpp
            cpuinfo.cpp
            glsl2spv.cpp
            meminfo.cpp
            emulator.cpp
            emulator_aps3e.cpp
            rpcs3/rpcs3/Input/raw_mouse_config.cpp
            rpcs3/rpcs3/Input/raw_mouse_handler.cpp
            rpcs3/rpcs3/Input/product_info.cpp
            rpcs3/rpcs3/rpcs3_version.cpp
            rpcs3/rpcs3/stdafx.cpp
          )
          
          target_include_directories(ps3dream_bridge PRIVATE
            ${CMAKE_CURRENT_SOURCE_DIR}
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/rpcs3
          )
          
          target_link_libraries(ps3dream_bridge PRIVATE rpcs3_emu)
          
          find_library(METAL Metal)
          find_library(QUARTZ_CORE QuartzCore)
          find_library(UIKIT UIKit)
          find_library(FOUNDATION Foundation)
          
          target_link_libraries(ps3dream_bridge PRIVATE
            ${METAL} ${QUARTZ_CORE} ${UIKIT} ${FOUNDATION}
            pthread
          )
          
          set(MVK_LIB "${CMAKE_CURRENT_SOURCE_DIR}/../../MoltenVK-build/Package/Libraries/iOS/libMoltenVK.a")
          if(EXISTS "${MVK_LIB}")
            target_link_libraries(ps3dream_bridge PRIVATE "${MVK_LIB}")
          endif()
          CMAKEEOF

      - name: Build emulator
        run: |
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          cd "$APS3E_CPP"
          rm -rf build_ios
          mkdir build_ios && cd build_ios
          
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DIOS=TRUE \
            -DANDROID=TRUE \
            -DANDROID_PLATFORM_LEVEL=30 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -G Xcode
          
          echo "=== CMake configure done ==="
          
          cmake --build . --config Release -- \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          mkdir -p Payload/Ps3Dream.app
          
          find "$APS3E_CPP/build_ios" \( -name "*.dylib" -o -name "*.a" \) \
            -path "*/Release/*" -exec cp {} Payload/Ps3Dream.app/ \; 2>/dev/null || true
          find "$APS3E_CPP/build_ios" -name "libps3dream_bridge.dylib" -exec cp {} Payload/Ps3Dream.app/ \; 2>/dev/null || true
          find "$APS3E_CPP/build_ios" -name "*.dylib" -exec cp {} Payload/Ps3Dream.app/ \; 2>/dev/null || true
          
          cp Ps3Dream/Info.plist Payload/Ps3Dream.app/
          
          echo "=== IPA contents ==="
          ls -la Payload/Ps3Dream.app/
          
          zip -r -y Ps3Dream.ipa Payload/
          ls -lh Ps3Dream.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ps3Dream-iOS-IPA
          path: Ps3Dream.ipa
          retention-days: 30
