name: Build Ps3Dream iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install build tools
        run: brew install cmake pkg-config ninja llvm@22

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-ios
          max-size: 2G

      - name: Clone rpcs3 core (pinned)
        run: |
          git init rpcs3_build
          git -C rpcs3_build remote add origin https://github.com/RPCS3/rpcs3.git
          git -C rpcs3_build fetch --depth 1 origin db907a258687a86fb30275765e8e7ca430567897
          git -C rpcs3_build checkout FETCH_HEAD
          git -C rpcs3_build submodule update --init --recursive --depth 1 --jobs 8
          echo "rpcs3 pinned to db907a258687a86fb30275765e8e7ca430567897"
          ls rpcs3_build/CMakeLists.txt

      - name: Build LLVM for iOS arm64
        run: |
          set -e
          LLVM_SRC="$PWD/rpcs3_build/3rdparty/llvm/llvm"
          LLVM_BUILD="$PWD/llvm-build"
          LLVM_INSTALL="$PWD/llvm-ios-install"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG_BIN="$(brew --prefix llvm@22)/bin"

          test -f "$LLVM_SRC/llvm/CMakeLists.txt" || { echo "LLVM submodule missing"; exit 1; }
          test -x "$CLANG_BIN/llvm-tblgen" || { echo "brew llvm-tblgen missing"; exit 1; }
          echo "iOS SDK: $IOS_SDK"
          echo "LLVM tblgen: $($CLANG_BIN/llvm-tblgen --version | head -1)"

          cmake -S "$LLVM_SRC/llvm" -B "$LLVM_BUILD" -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER="$CLANG_BIN/clang" \
            -DCMAKE_CXX_COMPILER="$CLANG_BIN/clang++" \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios17.0 \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios17.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_TARGET_ARCH=AArch64 \
            -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios17.0 \
            -DLLVM_TABLEGEN="$CLANG_BIN/llvm-tblgen" \
            -DLLVM_BUILD_RUNTIME=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_NO_DEAD_STRIP=ON \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_ENABLE_WARNINGS=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_THREADS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DCMAKE_INSTALL_PREFIX="$LLVM_INSTALL"

          cmake --build "$LLVM_BUILD" -- -j 4
          cmake --install "$LLVM_BUILD"
          echo "=== LLVM iOS install ==="
          ls "$LLVM_INSTALL/lib/cmake/llvm/LLVMConfig.cmake"
          ls "$LLVM_INSTALL/lib" | head -40

      - name: Download MoltenVK pre-built
        run: |
          curl -L -o MoltenVK-ios.tar \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2-rc1/MoltenVK-ios.tar"
          mkdir -p MoltenVK-build
          tar xf MoltenVK-ios.tar -C MoltenVK-build
          find MoltenVK-build -name "libMoltenVK.a" -o -name "MoltenVK.xcframework" 2>/dev/null | head -10
          find MoltenVK-build -name "mvk_vulkan.h" 2>/dev/null | head -5
          find MoltenVK-build -type d -name "Headers" 2>/dev/null | head -5
          ls -la MoltenVK-build/Package/Headers/ 2>/dev/null || echo "No Package/Headers dir"
          
          # Download Vulkan headers if not in MoltenVK tar
          if [ ! -f "MoltenVK-build/Package/Headers/vulkan/vulkan.h" ]; then
            echo "Vulkan headers not in MoltenVK tar, downloading Vulkan-Headers..."
            git clone --depth 1 --filter=blob:none --sparse https://github.com/KhronosGroup/Vulkan-Headers.git Vulkan-Headers
            cd Vulkan-Headers
            git sparse-checkout set include/vulkan include/vk_video
            cd ..
            mkdir -p MoltenVK-build/vulkan_headers
            cp -r Vulkan-Headers/include/vulkan MoltenVK-build/vulkan_headers/vulkan
            cp -r Vulkan-Headers/include/vk_video MoltenVK-build/vulkan_headers/vk_video
          else
            echo "Vulkan headers found in MoltenVK tar"
          fi
          
          # Always create MoltenVK/mvk_vulkan.h stub as fallback
          mkdir -p MoltenVK-build/stub_headers/MoltenVK
          if [ ! -f MoltenVK-build/Package/Headers/MoltenVK/mvk_vulkan.h ]; then
            # Try to find real MoltenVK headers anywhere in the tar extraction
            REAL_MVK_VULKAN=$(find MoltenVK-build -name "mvk_vulkan.h" 2>/dev/null | head -1)
            REAL_MVK_PRIV=$(find MoltenVK-build -name "mvk_private_api.h" 2>/dev/null | head -1)
            if [ -n "$REAL_MVK_VULKAN" ]; then
              cp "$REAL_MVK_VULKAN" MoltenVK-build/stub_headers/MoltenVK/mvk_vulkan.h
            else
              printf '#pragma once\n#include <vulkan/vulkan.h>\n' > MoltenVK-build/stub_headers/MoltenVK/mvk_vulkan.h
            fi
            if [ -n "$REAL_MVK_PRIV" ]; then
              cp "$REAL_MVK_PRIV" MoltenVK-build/stub_headers/MoltenVK/mvk_private_api.h
            else
              # Minimal stub for mvk_private_api.h
              printf '#pragma once\n#include <vulkan/vulkan.h>\ntypedef uint32_t MTLLanguageVersion;\ntypedef uint32_t MTLArgumentBuffersTier;\ntypedef struct { VkBool32 debugMode; } MVKConfiguration;\ntypedef struct { uint32_t count; double latest; double previous; double average; double minimum; double maximum; } MVKPerformanceTracker;\ntypedef struct { MVKPerformanceTracker shaderCompilation; } MVKPerformanceStatistics;\n' > MoltenVK-build/stub_headers/MoltenVK/mvk_private_api.h
            fi
          fi

      - name: Prepare source tree
        run: |
          SRC_DIR=build_src
          mkdir -p "$SRC_DIR/rpcs3"
          
          # Copy rpcs3 root CMakeLists.txt
          cp rpcs3_build/CMakeLists.txt "$SRC_DIR/rpcs3/CMakeLists.txt"
          
          # Copy rpcs3 core source
          rm -rf "$SRC_DIR/rpcs3/rpcs3"
          cp -r rpcs3_build/rpcs3 "$SRC_DIR/rpcs3/rpcs3"
          
          # Copy 3rdparty from rpcs3
          mkdir -p "$SRC_DIR/rpcs3/3rdparty"
          cp -rn rpcs3_build/3rdparty/* "$SRC_DIR/rpcs3/3rdparty/" 2>/dev/null || true
          
          # Copy buildfiles (ConfigureCompiler.cmake etc.)
          cp -r rpcs3_build/buildfiles "$SRC_DIR/rpcs3/" 2>/dev/null || true
          
          # Copy all root-level dirs that rpcs3 source may reference
          for d in Utilities darwin; do
            if [ -d "rpcs3_build/$d" ]; then
              cp -r "rpcs3_build/$d" "$SRC_DIR/rpcs3/"
            fi
          done
          
          # Create stub dirs for missing dependencies
          mkdir -p "$SRC_DIR/rpcs3/3rdparty/libadrenotools"
          echo "add_library(adrenotools INTERFACE)" > "$SRC_DIR/rpcs3/3rdparty/libadrenotools/CMakeLists.txt"
          mkdir -p "$SRC_DIR/rpcs3/3rdparty/libadrenotools/include/adrenotools"
          cat > "$SRC_DIR/rpcs3/3rdparty/libadrenotools/include/adrenotools/priv.h" << 'ADREOF'
          #pragma once
          ADREOF
          cat > "$SRC_DIR/rpcs3/3rdparty/libadrenotools/include/adrenotools/driver.h" << 'ADREOF2'
          #pragma once
          #include <dlfcn.h>
          #define ADRENOTOOLS_DRIVER_CUSTOM 1
          static inline void* adrenotools_open_libvulkan(int flags, int driver_type, void* a3, const char* hook_dir, const char* custom_lib_dir, const char* custom_lib_name, void* a7, void* a8) {
            (void)flags;(void)driver_type;(void)a3;(void)hook_dir;(void)custom_lib_dir;(void)custom_lib_name;(void)a7;(void)a8;
            return dlopen("libvulkan.so", RTLD_NOW | RTLD_NOLOAD);
          }
          ADREOF2
          
          # Download Vulkan Memory Allocator header
          mkdir -p "$SRC_DIR/rpcs3/3rdparty/VulkanMemoryAllocator/include"
          curl -L -o "$SRC_DIR/rpcs3/3rdparty/VulkanMemoryAllocator/include/vk_mem_alloc.h" \
            "https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/master/include/vk_mem_alloc.h"
          ls -la "$SRC_DIR/rpcs3/3rdparty/VulkanMemoryAllocator/include/vk_mem_alloc.h"
          
          mkdir -p "$SRC_DIR/rpcs3/3rdparty/xxHash/cmake_unofficial"
          cat > "$SRC_DIR/rpcs3/3rdparty/xxHash/cmake_unofficial/CMakeLists.txt" << 'EOF'
          add_library(xxhash INTERFACE)
          target_include_directories(xxhash INTERFACE ${CMAKE_CURRENT_SOURCE_DIR}/..)
          EOF
          mkdir -p "$SRC_DIR/rpcs3/3rdparty/xxHash"
          touch "$SRC_DIR/rpcs3/3rdparty/xxHash/xxhash.h"
          
          # Delete rpcs3's custom FindZLIB.cmake
          rm -f "$SRC_DIR/rpcs3/buildfiles/cmake/FindZLIB.cmake"
          
          # Create stub ffmpeg headers
          mkdir -p "$SRC_DIR/ffmpeg_stubs/libavutil" \
                   "$SRC_DIR/ffmpeg_stubs/libavcodec" \
                   "$SRC_DIR/ffmpeg_stubs/libavformat" \
                   "$SRC_DIR/ffmpeg_stubs/libswscale" \
                   "$SRC_DIR/ffmpeg_stubs/libswresample"
          
          # Create a single comprehensive ffmpeg stub header that defines everything
          # rpcs3's media_utils.cpp uses modern ffmpeg 7.x APIs - easier to have one
          # monolithic header than play whack-a-mole with individual headers
          FDIR="$SRC_DIR/ffmpeg_stubs"
          mkdir -p "$FDIR/libavcodec" "$FDIR/libavformat" "$FDIR/libavutil" \
                   "$FDIR/libswscale" "$FDIR/libswresample"
          
          cat > "$FDIR/ffmpeg_stub_all.h" << 'FFALL'
          #pragma once
          #include <stdint.h>
          #include <stddef.h>
          #include <stdarg.h>
          #include <string.h>
          #include <stdlib.h>
          
          #define FFERRTAG(a,b,c,d) ((int)((unsigned char)(a)|(unsigned char)(b)<<8|(unsigned char)(c)<<16|(unsigned char)(d)<<24))
          #define AVERROR_EOF          FFERRTAG('E','O','F',' ')
          #define AVERROR_INVALIDDATA  FFERRTAG('I','N','D','I')
          #define AVERROR_EXIT         FFERRTAG('E','X','I','T')
          #define AVERROR(E)          (-(E))
          #define AVUNERROR(E)        (-(E))
          #define AV_ERROR_MAX_STRING_SIZE 128
          
          #define AV_ROUND_ZERO 0
          #define AV_ROUND_UP 1
          #define AV_ROUND_DOWN 2
          #define AV_ROUND_NEAR_INF 5
          #define AV_TIME_BASE 1000000
          #define FFALIGN(x,a) (((x)+(a)-1)&~((a)-1))
          #define AV_PKT_FLAG_KEY 1
          #define AV_INPUT_BUFFER_PADDING_SIZE 32
          #define FF_COMPLIANCE_NORMAL 0
          #define AV_LOG_SKIP_REPEATED 1
          #define AV_LOG_PRINT_LEVEL 16
          #define AV_DICT_IGNORE_SUFFIX 2
          #define AV_FRAME_FLAG_KEY 1
          #define AV_FRAME_FLAG_DISCARD 4
          #define SWS_FAST_BILINEAR 1
          #define SWS_BILINEAR 2
          #define SWS_BICUBIC 4
          #define SWS_POINT 8
          #define AVFMT_GLOBALHEADER 0x0040
          #define AVFMT_NOFILE 1
          #define AV_CODEC_FLAG_GLOBAL_HEADER (1 << 22)
          #define AVIO_FLAG_WRITE 2
          #define AV_FRAME_MAKE_WRITABLE 1
          #define AV_VERSION_INT(a,b,c) ((a)<<16|(b)<<8|(c))
          #define AV_VERSION_MAJOR(a) ((a)>>16)
          #define AV_VERSION_MINOR(a) (((a)>>8)&0xFF)
          #define AV_VERSION_MICRO(a) ((a)&0xFF)
          #define AVDISCARD_NONE 0
          #define AVDISCARD_NONREF 8
          #define AVDISCARD_BIDIR 16
          #define AVDISCARD_NONKEY 32
          #define AVDISCARD_ALL 48
          #define AVDISCARD_NONINTRA 24
          #define AVDISCARD_DEFAULT 0
          #define AV_CODEC_PROP_FIELDS (1<<0)
          #define AV_FRAME_FLAG_INTERLACED 1
          #define AV_FRAME_FLAG_KEY 1
          #define AV_FRAME_FLAG_DISCARD 4
          #define AV_PICTURE_TYPE_NONE 0
          #define AV_PICTURE_TYPE_I 1
          #define AV_PICTURE_TYPE_P 2
          #define AV_PICTURE_TYPE_B 3
          #define FF_THREAD_SLICE 1
          #define FF_THREAD_FRAME 2
          #define AV_FRAME_BUF_SIZE 64
          
          typedef enum { AV_LOG_QUIET=-8, AV_LOG_PANIC=0, AV_LOG_FATAL=8, AV_LOG_ERROR=16, AV_LOG_WARNING=24, AV_LOG_INFO=32, AV_LOG_VERBOSE=40, AV_LOG_DEBUG=48, AV_LOG_TRACE=56 } AVLogLevel;
          typedef enum { AV_CODEC_ID_NONE=0, AV_CODEC_ID_MPEG2VIDEO=2, AV_CODEC_ID_MPEG4=12, AV_CODEC_ID_H264=27, AV_CODEC_ID_HEVC=173, AV_CODEC_ID_VP8=139, AV_CODEC_ID_VP9=167, AV_CODEC_ID_AAC=86018, AV_CODEC_ID_MP3=86017, AV_CODEC_ID_AC3=86019, AV_CODEC_ID_ATRAC3=86029, AV_CODEC_ID_ATRAC3P=86079 } AVCodecID;
          enum AVMediaType { AVMEDIA_TYPE_UNKNOWN=-1, AVMEDIA_TYPE_VIDEO=0, AVMEDIA_TYPE_AUDIO=1, AVMEDIA_TYPE_DATA=2, AVMEDIA_TYPE_SUBTITLE=3, AVMEDIA_TYPE_ATTACHMENT=4 };
          enum AVPixelFormat { AV_PIX_FMT_NONE=-1, AV_PIX_FMT_YUV420P=0, AV_PIX_FMT_YUYV422=1, AV_PIX_FMT_RGB24=2, AV_PIX_FMT_BGR24=3, AV_PIX_FMT_YUV422P=4, AV_PIX_FMT_YUV444P=5, AV_PIX_FMT_GRAY8=8, AV_PIX_FMT_NV21=24, AV_PIX_FMT_ARGB=25, AV_PIX_FMT_RGBA=26, AV_PIX_FMT_ABGR=27, AV_PIX_FMT_BGRA=28, AV_PIX_FMT_RGB565BE=29, AV_PIX_FMT_RGB565LE=30, AV_PIX_FMT_NV12=23, AV_PIX_FMT_VIDEOTOOLBOX=100, AV_PIX_FMT_YUVA420P=32, AV_PIX_FMT_UYVY422=17, AV_PIX_FMT_YUVJ420P=12 };
          enum AVSampleFormat { AV_SAMPLE_FMT_NONE=-1, AV_SAMPLE_FMT_U8=0, AV_SAMPLE_FMT_S16=1, AV_SAMPLE_FMT_S32=2, AV_SAMPLE_FMT_FLT=3, AV_SAMPLE_FMT_DBL=4, AV_SAMPLE_FMT_S16P=5, AV_SAMPLE_FMT_S32P=6, AV_SAMPLE_FMT_FLTP=7, AV_SAMPLE_FMT_DBLP=8 };
          
          typedef struct AVRational { int num; int den; } AVRational;
          typedef struct AVDictionary AVDictionary;
          typedef struct AVDictionaryEntry { char *key; char *value; } AVDictionaryEntry;
          typedef struct AVChannelLayout { uint64_t order; uint64_t nb_channels; union { uint64_t mask; int index; } u; } AVChannelLayout;
          typedef struct AVInputFormat AVInputFormat;
          typedef struct AVOutputFormat AVOutputFormat;
          typedef struct AVStream AVStream;
          typedef struct AVFormatContext AVFormatContext;
          typedef struct AVIOContext AVIOContext;
          
          #define AV_CHANNEL_LAYOUT_STEREO ((AVChannelLayout){0,2,{{3}}})
          #define AV_CHANNEL_LAYOUT_5POINT1 ((AVChannelLayout){0,6,{{63}}})
          #define AV_CHANNEL_LAYOUT_7POINT1 ((AVChannelLayout){0,8,{{255}}})
          
          typedef struct AVCodecParameters {
            int codec_type;
            int codec_id;
            uint32_t codec_tag;
            int bit_rate;
            int bits_per_coded_sample;
            int bits_per_raw_sample;
            int sample_rate;
            int format;
            int channels;
            int channel_layout;
            AVChannelLayout ch_layout;
            int block_align;
            int frame_size;
          } AVCodecParameters;
          
          typedef struct AVCodecDescriptor {
            int id;
            int type;
            const char *name;
            const char *long_name;
          } AVCodecDescriptor;
          
          typedef struct AVFrame {
            uint8_t *data[8];
            int linesize[8];
            int width;
            int height;
            int format;
            int key_frame;
            int64_t pts;
            int64_t pkt_dts;
            AVRational time_base;
            int nb_samples;
            int channels;
            int channel_layout;
            int sample_rate;
            int format2;
            AVChannelLayout ch_layout;
            int64_t best_effort_timestamp;
            int flags;
            int repeat_pict;
            int pict_type;
            int interlaced_frame;
            int64_t pkt_duration;
            struct AVBufferRef *buf[8];
          } AVFrame;
          
          typedef struct AVPacket {
            uint8_t *data;
            int size;
            int64_t pts;
            int64_t dts;
            int stream_index;
            int flags;
            int64_t duration;
            int64_t pos;
            struct AVBufferRef *buf;
          } AVPacket;
          
          typedef struct AVCodecContext {
            const void *av_class;
            int log_level_offset;
            int codec_type;
            const void *codec;
            int codec_id;
            uint32_t codec_tag;
            int bit_rate;
            int bits_per_coded_sample;
            int bits_per_raw_sample;
            int sample_rate;
            int channels;
            int channel_layout;
            int frame_size;
            int gop_size;
            int max_b_frames;
            float qcompress;
            float qblur;
            int width;
            int height;
            AVRational time_base;
            AVRational framerate;
            int pix_fmt;
            AVSampleFormat sample_fmt;
            AVChannelLayout ch_layout;
            void *extradata;
            int extradata_size;
            int flags;
            int skip_frame;
            int thread_count;
            int thread_type;
            int ticks_per_frame;
            int block_align;
            void *opaque;
            int (*get_buffer2)(struct AVCodecContext *s, struct AVFrame *frame, int flags);
          } AVCodecContext;
          
          typedef struct AVCodec {
            const char *name;
            const char *long_name;
            AVCodecID id;
            int type;
            int capabilities;
          } AVCodec;
          
          typedef struct AVStream {
            int index;
            int id;
            AVCodecParameters *codecpar;
            AVRational time_base;
            int64_t duration;
            AVRational avg_frame_rate;
            AVDictionary *metadata;
          } AVStream;
          
          typedef struct AVFormatContext {
            const void *av_class;
            AVInputFormat *iformat;
            AVOutputFormat *oformat;
            AVStream **streams;
            unsigned int nb_streams;
            int64_t duration;
            int64_t bit_rate;
            AVDictionary *metadata;
            char *url;
            int flags;
            AVIOContext *pb;
          } AVFormatContext;
          
          typedef struct AVInputFormat { int dummy; } AVInputFormat;
          typedef struct AVOutputFormat {
            const char *name;
            const char *long_name;
            const char *mime_type;
            const char *extensions;
            AVCodecID audio_codec;
            AVCodecID video_codec;
            AVCodecID subtitle_codec;
            int flags;
          } AVOutputFormat;
          typedef struct AVIOContext { int dummy; } AVIOContext;
          typedef struct AVPacketList { int dummy; } AVPacketList;
          typedef struct AVBitStreamFilterContext { int dummy; } AVBitStreamFilterContext;
          typedef struct AVCodecParserContext { int dummy; } AVCodecParserContext;
          typedef struct AVCodecParser { int dummy; } AVCodecParser;
          typedef struct AVOption { int dummy; } AVOption;
          typedef struct AVBufferRef { int dummy; } AVBufferRef;
          typedef struct AVBuffer { int dummy; } AVBuffer;
          typedef struct AVBPrint { char *str; unsigned size; unsigned reserved; int internal_size; } AVBPrint;
          typedef struct AVAudioFifo { int dummy; } AVAudioFifo;
          typedef struct SwrContext { int dummy; } SwrContext;
          typedef struct SwsContext SwsContext;
          typedef struct AVExpr { int dummy; } AVExpr;
          typedef struct AVPixFmtDescriptor { int dummy; } AVPixFmtDescriptor;
          typedef struct AVMasteringDisplayMetadata { int dummy; } AVMasteringDisplayMetadata;
          typedef struct AVContentLightMetadata { int dummy; } AVContentLightMetadata;
          typedef struct AVDynamicHDRPlus { int dummy; } AVDynamicHDRPlus;
          typedef struct AVFilmGrainParams { int dummy; } AVFilmGrainParams;
          typedef struct AVCRC { int dummy; } AVCRC;
          typedef struct AVFrameSideData { int dummy; } AVFrameSideData;
          typedef struct AVCodecHWConfigInternal { int dummy; } AVCodecHWConfigInternal;
          
          enum { AV_CPU_FLAG_SSE=1, AV_CPU_FLAG_SSE2=2, AV_CPU_FLAG_SSE3=4, AV_CPU_FLAG_SSSE3=8, AV_CPU_FLAG_SSE41=16, AV_CPU_FLAG_SSE42=32, AV_CPU_FLAG_AVX=64, AV_CPU_FLAG_AVX2=128 };
          
          typedef enum { AV_CODEC_CONFIG_SAMPLE_FORMAT=0, AV_CODEC_CONFIG_SAMPLE_RATE=1, AV_CODEC_CONFIG_CHANNEL_LAYOUT=2, AV_CODEC_CONFIG_VIDEO_FORMAT=3, AV_CODEC_CONFIG_PIX_FMT=4 } AVCodecConfig;
          
          static inline char *av_make_error_string(char *a,size_t b,int c){(void)b;(void)c;if(a&&b>0)a[0]=0;return a;}
          static inline int av_strerror(int e,char *b,size_t c){(void)e;(void)b;(void)c;return 0;}
          static inline void av_log_set_level(int a){(void)a;}
          static inline int av_log_get_level(void){return 0;}
          static inline void av_log(void *a,int b,const char *fmt,...){(void)a;(void)b;(void)fmt;}
          static inline int av_log_format_line2(void *a,int b,const char *fmt,va_list vl,char *c,int d,int *e){(void)a;(void)b;(void)fmt;(void)vl;(void)c;(void)d;(void)e;return 0;}
          typedef void (*av_log_callback)(void*,int,const char*,va_list);
          static inline void av_log_set_callback(av_log_callback a){(void)a;}
          static inline int av_rescale_rnd(long long a,long long b,long long c,int d){(void)a;(void)b;(void)c;(void)d;return 0;}
          static inline int64_t av_rescale_q(int64_t a,AVRational b,AVRational c){(void)a;(void)b;(void)c;return 0;}
          static inline int av_clip(int a,int b,int c){(void)a;(void)b;(void)c;return 0;}
          static inline int64_t av_rescale(int64_t a,int64_t b,int64_t c){(void)a;(void)b;(void)c;return 0;}
          static inline int64_t av_rescale_q_rnd(int64_t a,AVRational b,AVRational c,int d){(void)a;(void)b;(void)c;(void)d;return 0;}
          static inline int av_get_channel_layout_nb_channels(uint64_t a){(void)a;return 2;}
