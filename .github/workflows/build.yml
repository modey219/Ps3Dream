name: Build Ps3Dream iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install build tools
        run: |
          brew install cmake pkg-config

      - name: Clone rpcs3 core
        run: |
          cd $GITHUB_WORKSPACE
          # Clone rpcs3 into the APS3E rpcs3/ directory (provides rpcs3/rpcs3/ core)
          git clone --depth 1 --recursive https://github.com/RPCS3/rpcs3.git rpcs3_build
          echo "rpcs3 cloned"

      - name: Build MoltenVK for iOS
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth 1 https://github.com/KhronosGroup/MoltenVK.git MoltenVK-build
          cd MoltenVK-build
          ./fetchDependencies --ios 2>&1 || ./fetchDependencies 2>&1 || true
          make molten-vk-ios 2>&1 || make mvk-ios 2>&1 || true
          # Find the built library
          find . -name "libMoltenVK.a" -o -name "MoltenVK.a" 2>/dev/null
          echo "MoltenVK build attempted"

      - name: Prepare iOS build
        run: |
          cd $GITHUB_WORKSPACE
          
          # Set up the APS3E source directory with rpcs3 core
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          # Copy rpcs3 core into APS3E structure
          mkdir -p "$APS3E_CPP/rpcs3/rpcs3"
          cp -r rpcs3_build/rpcs3/* "$APS3E_CPP/rpcs3/rpcs3/"
          
          # Copy APS3E's 3rdparty
          # (already exists in aps3e-extracted)
          
          echo "Source prepared"
          ls "$APS3E_CPP/rpcs3/" | head -20
          ls "$APS3E_CPP/rpcs3/rpcs3/" | head -20

      - name: Create iOS CMakeLists
        run: |
          cd $GITHUB_WORKSPACE
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          # Create an iOS-adapted CMakeLists.txt
          cat > "$APS3E_CPP/CMakeLists_iOS.txt" << 'CMAKE_EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("ps3dream" LANGUAGES C CXX OBJCXX)
          
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)
          set(CMAKE_OSX_DEPLOYMENT_TARGET 17.0 CACHE STRING "Minimum iOS version")
          set(CMAKE_OSX_ARCHITECTURES "arm64" CACHE STRING "Target architecture")
          
          add_compile_options(-march=armv8-a)
          add_compile_options(-stdlib=libc++)
          add_compile_options(-Wno-multichar -Wno-ignored-pragmas -Wno-attributes -Wno-missing-field-initializers)
          
          add_definitions(-DENABLE_JIT=1 -DARCH_ARM64=1 -DUNIX_POSIX=1 -D__APPLE__=1 -DAPPLE=1)
          
          # Build rpcs3
          set(BUILD_LLVM OFF CACHE BOOL "" FORCE)
          set(USE_NATIVE_INSTRUCTIONS OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_FFMPEG OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_LIBUSB OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_CURL OFF CACHE BOOL "" FORCE)
          set(USE_VULKAN OFF CACHE BOOL "" FORCE)
          set(USE_FAUDIO OFF CACHE BOOL "" FORCE)
          set(USE_SDL OFF CACHE BOOL "" FORCE)
          set(USE_LIBEVDEV OFF CACHE BOOL "" FORCE)
          set(USE_ALSA OFF CACHE BOOL "" FORCE)
          set(USE_PULSE OFF CACHE BOOL "" FORCE)
          set(USE_WOLFSSL OFF CACHE BOOL "" FORCE)
          set(USE_OPENAL OFF CACHE BOOL "" FORCE)
          set(USE_CUBEB OFF CACHE BOOL "" FORCE)
          set(USE_GLLD OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_GLSLANG OFF CACHE BOOL "" FORCE)
          
          add_subdirectory(rpcs3 EXCLUDE_FROM_ALL)
          
          # Build APS3E core
          add_library(ps3dream_emu SHARED
            aps3e_rp3_impl.cpp
            aps3e_emu.cpp
            aps3e.cpp
            vkapi.cpp
            vkutil.cpp
            cpuinfo.cpp
            glsl2spv.cpp
            meminfo.cpp
            emulator.cpp
            emulator_aps3e.cpp
            rpcs3/rpcs3/Input/raw_mouse_config.cpp
            rpcs3/rpcs3/Input/raw_mouse_handler.cpp
            rpcs3/rpcs3/Input/product_info.cpp
            rpcs3/rpcs3/rpcs3_version.cpp
            rpcs3/rpcs3/stb_image.cpp
            rpcs3/rpcs3/stdafx.cpp
          )
          
          target_include_directories(ps3dream_emu PRIVATE
            ${CMAKE_CURRENT_SOURCE_DIR}
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/rpcs3
          )
          
          target_link_libraries(ps3dream_emu PRIVATE rpcs3_emu)
          target_link_libraries(ps3dream_emu PRIVATE 3rdparty::yaml-cpp 3rdparty::glslang)
          
          # iOS frameworks
          find_library(METAL Metal)
          find_library(QUARTZ_CORE QuartzCore)
          find_library(UIKIT UIKit)
          find_library(FOUNDATION Foundation)
          find_library(IOKIT IOKit)
          
          target_link_libraries(ps3dream_emu PRIVATE
            ${METAL} ${QUARTZ_CORE} ${UIKIT} ${FOUNDATION} ${IOKIT}
            pthread dl
          )
          
          # Link MoltenVK if available
          if(EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/MoltenVK-build/libMoltenVK.a")
            target_link_libraries(ps3dream_emu PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/MoltenVK-build/libMoltenVK.a")
          endif()
          CMAKE_EOF
          
          echo "iOS CMakeLists created"

      - name: Build emulator
        run: |
          cd $GITHUB_WORKSPACE
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          mkdir -p "$APS3E_CPP/build_ios"
          cd "$APS3E_CPP/build_ios"
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -G Xcode \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            2>&1 | tail -30 || echo "CMake config done"
          
          cmake --build . --config Release -- \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -50 || echo "Build attempted"

      - name: Package IPA
        run: |
          cd $GITHUB_WORKSPACE
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          mkdir -p Payload/Ps3Dream.app
          
          # Find and copy built binaries
          find "$APS3E_CPP/build_ios" -name "*.dylib" -exec cp {} Payload/Ps3Dream.app/ \; 2>/dev/null || true
          find "$APS3E_CPP/build_ios" -name "*.a" -exec cp {} Payload/Ps3Dream.app/ \; 2>/dev/null || true
          find "$APS3E_CPP/build_ios" -name "*.app" -exec cp -R {} Payload/ \; 2>/dev/null || true
          
          # Copy Info.plist
          cp Ps3Dream/Info.plist Payload/Ps3Dream.app/ 2>/dev/null || cat > Payload/Ps3Dream.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>en</string>
              <key>CFBundleDisplayName</key><string>Ps3Dream</string>
              <key>CFBundleExecutable</key><string>ps3dream_emu</string>
              <key>CFBundleIdentifier</key><string>com.ps3dream.Ps3Dream</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>Ps3Dream</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>17.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
          </dict>
          </plist>
          PLIST
          
          # Show what we built
          echo "=== Build artifacts ==="
          ls -la Payload/Ps3Dream.app/ || true
          find "$APS3E_CPP/build_ios" -name "*.dylib" -o -name "*.a" -o -name "*.framework" 2>/dev/null | head -20
          
          # Create IPA
          zip -r -y Ps3Dream.ipa Payload/
          ls -lh Ps3Dream.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ps3Dream-iOS-IPA
          path: Ps3Dream.ipa
          retention-days: 30
