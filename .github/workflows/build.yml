name: Build Ps3Dream iOS
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
    - name: Install build tools
      run: brew install cmake pkg-config
    - name: Clone rpcs3 core
      run: 'git clone --depth 1 --recursive https://github.com/RPCS3/rpcs3.git rpcs3_build

        ls rpcs3_build/CMakeLists.txt

        ls rpcs3_build/rpcs3/ | head -10

        echo "rpcs3 cloned successfully"'
    - name: Download MoltenVK pre-built
      run: "curl -L -o MoltenVK-ios.tar \\\n  \"https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2-rc1/MoltenVK-ios.tar\"\
        \nmkdir -p MoltenVK-build\ntar xf MoltenVK-ios.tar -C MoltenVK-build\nfind\
        \ MoltenVK-build -name \"libMoltenVK.a\" -o -name \"MoltenVK.xcframework\"\
        \ 2>/dev/null | head -10"
    - name: Prepare source tree
      run: "APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp\n\n# Verify source\
        \ exists\necho \"=== rpcs3_build contents ===\"\nls rpcs3_build/ | head -10\n\
        echo \"=== APS3E rpcs3 dir ===\"\nls \"$APS3E_CPP/rpcs3/\" | head -10\n\n\
        # Copy rpcs3 root CMakeLists.txt\ncp rpcs3_build/CMakeLists.txt \"$APS3E_CPP/rpcs3/CMakeLists.txt\"\
        \n\n# Copy rpcs3 core source\nrm -rf \"$APS3E_CPP/rpcs3/rpcs3\"\ncp -r rpcs3_build/rpcs3\
        \ \"$APS3E_CPP/rpcs3/rpcs3\"\n\n# Also copy 3rdparty from rpcs3 if it has\
        \ better structure\ncp -rn rpcs3_build/3rdparty/* \"$APS3E_CPP/rpcs3/3rdparty/\"\
        \ 2>/dev/null || true\n\n# Copy buildfiles (contains ConfigureCompiler.cmake\
        \ etc.)\ncp -r rpcs3_build/buildfiles \"$APS3E_CPP/rpcs3/\" 2>/dev/null ||\
        \ true\n\n# Copy all root-level dirs that rpcs3 source may reference via relative\
        \ paths\nfor d in Utilities darwin; do\n  if [ -d \"rpcs3_build/$d\" ]; then\n\
        \    cp -r \"rpcs3_build/$d\" \"$APS3E_CPP/rpcs3/\"\n    echo \"Copied rpcs3_build/$d\"\
        \n  fi\ndone\n\n# List files to verify\necho \"=== rpcs3 root ===\"\nls rpcs3_build/\
        \ | head -20\necho \"=== rpcs3/rpcs3 top-level files ===\"\nls rpcs3_build/rpcs3/*.cpp\
        \ 2>/dev/null | head -10\n\n# Create stub dirs for missing subdirectories\
        \ that CMakeLists expects\nmkdir -p \"$APS3E_CPP/rpcs3/3rdparty/libadrenotools\"\
        \necho \"add_library(adrenotools INTERFACE)\" > \"$APS3E_CPP/rpcs3/3rdparty/libadrenotools/CMakeLists.txt\"\
        \n\n# Create xxHash stub\nmkdir -p \"$APS3E_CPP/rpcs3/3rdparty/xxHash/cmake_unofficial\"\
        \ncat > \"$APS3E_CPP/rpcs3/3rdparty/xxHash/cmake_unofficial/CMakeLists.txt\"\
        \ << 'XXHASH_EOF'\nadd_library(xxhash INTERFACE)\ntarget_include_directories(xxhash\
        \ INTERFACE ${CMAKE_CURRENT_SOURCE_DIR}/..)\nXXHASH_EOF\nmkdir -p \"$APS3E_CPP/rpcs3/3rdparty/xxHash\"\
        \ntouch \"$APS3E_CPP/rpcs3/3rdparty/xxHash/xxhash.h\"\n\n# Delete rpcs3 custom\
        \ FindZLIB.cmake\nrm -f \"$APS3E_CPP/rpcs3/buildfiles/cmake/FindZLIB.cmake\"\
        \necho \"Deleted rpcs3 FindZLIB.cmake\"\n\n# Create stub ffmpeg headers\n\
        mkdir -p \"$APS3E_CPP/ffmpeg_stubs/libavutil\" \\\n         \"$APS3E_CPP/ffmpeg_stubs/libavcodec\"\
        \ \\\n         \"$APS3E_CPP/ffmpeg_stubs/libavformat\" \\\n         \"$APS3E_CPP/ffmpeg_stubs/libswscale\"\
        \ \\\n         \"$APS3E_CPP/ffmpeg_stubs/libswresample\"\n\necho '#pragma\
        \ once' > \"$APS3E_CPP/ffmpeg_stubs/libavutil/pixfmt.h\"\necho 'enum AVPixelFormat\
        \ { AV_PIX_FMT_NONE=-1, AV_PIX_FMT_YUV420P=0, AV_PIX_FMT_YUYV422=1, AV_PIX_FMT_RGB24=2,\
        \ AV_PIX_FMT_BGR24=3, AV_PIX_FMT_RGBA=26, AV_PIX_FMT_BGRA=28 };' >> \"$APS3E_CPP/ffmpeg_stubs/libavutil/pixfmt.h\"\
        \n\necho '#pragma once' > \"$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h\"\
        \necho '#include <stdint.h>' >> \"$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h\"\
        \necho 'typedef void SwsContext;' >> \"$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h\"\
        \necho 'enum { SWS_FAST_BILINEAR=1, SWS_BILINEAR=2, SWS_BICUBIC=4, SWS_POINT=8\
        \ };' >> \"$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h\"\necho 'static inline\
        \ SwsContext* sws_getContext(int a,int b,int c,int d,int e,int f,int g,void\
        \ *h,void *i,void *j){(void)a;(void)b;(void)c;(void)d;(void)e;(void)f;(void)g;(void)h;(void)i;(void)j;return\
        \ 0;}' >> \"$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h\"\necho 'static inline\
        \ SwsContext* sws_getCachedContext(SwsContext *c,int a,int b,int d,int e,int\
        \ f,int g,int h,void *i,void *j,void *k){(void)c;(void)a;(void)b;(void)d;(void)e;(void)f;(void)g;(void)h;(void)i;(void)j;(void)k;return\
        \ 0;}' >> \"$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h\"\necho 'static inline\
        \ int sws_scale(SwsContext *c,const uint8_t *const a[],const int b[],int d,int\
        \ e,uint8_t *const f[],const int g[]){(void)c;(void)a;(void)b;(void)d;(void)e;(void)f;(void)g;return\
        \ 0;}' >> \"$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h\"\necho 'static inline\
        \ void sws_freeContext(SwsContext *c){(void)c;}' >> \"$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h\"\
        \n\necho '#pragma once' > \"$APS3E_CPP/ffmpeg_stubs/libavutil/imgutils.h\"\
        \necho '#include <stdint.h>' >> \"$APS3E_CPP/ffmpeg_stubs/libavutil/imgutils.h\"\
        \necho 'static inline int av_image_fill_linesizes(int a[],int b,int c,int\
        \ d){(void)a;(void)b;(void)c;(void)d;return 0;}' >> \"$APS3E_CPP/ffmpeg_stubs/libavutil/imgutils.h\"\
        \necho 'static inline int av_image_fill_pointers(uint8_t *a[],int b,int c,uint8_t\
        \ *d,const int e[]){(void)a;(void)b;(void)c;(void)d;(void)e;return 0;}' >>\
        \ \"$APS3E_CPP/ffmpeg_stubs/libavutil/imgutils.h\"\n\necho \"Created ffmpeg\
        \ stub headers\"\nls -la \"$APS3E_CPP/ffmpeg_stubs/libavutil/\" \"$APS3E_CPP/ffmpeg_stubs/libswscale/\"\
        \n\n# Create a stub libusb.h (libusb is disabled on iOS)\ncat > \"$APS3E_CPP/ffmpeg_stubs/libusb.h\"\
        \ << 'LIBUSB_EOF'\n#pragma once\n#include <stdint.h>\n\n#ifndef LIBUSB_CALL\n\
        #define LIBUSB_CALL\n#endif\n\n#ifndef LIBUSB_CONTROL_SETUP_SIZE\n#define\
        \ LIBUSB_CONTROL_SETUP_SIZE 9\n#endif\n\nstruct libusb_context;\nstruct libusb_device;\n\
        struct libusb_device_handle;\nstruct libusb_device_descriptor { unsigned short\
        \ idVendor; unsigned short idProduct; unsigned char bNumConfigurations; };\n\
        struct libusb_config_descriptor { unsigned short wTotalLength; unsigned char\
        \ bNumInterfaces; };\nstruct libusb_interface { unsigned char num_altsetting;\
        \ };\n\nenum libusb_error { LIBUSB_SUCCESS=0, LIBUSB_ERROR_IO=-1, LIBUSB_ERROR_INVALID_PARAM=-2,\
        \ LIBUSB_ERROR_ACCESS=-3, LIBUSB_ERROR_NO_DEVICE=-4, LIBUSB_ERROR_NOT_FOUND=-5,\
        \ LIBUSB_ERROR_BUSY=-6, LIBUSB_ERROR_TIMEOUT=-7, LIBUSB_ERROR_OVERFLOW=-8,\
        \ LIBUSB_ERROR_PIPE=-9, LIBUSB_ERROR_INTERRUPTED=-10, LIBUSB_ERROR_NO_MEM=-11,\
        \ LIBUSB_ERROR_NOT_SUPPORTED=-12 };\nenum libusb_speed { LIBUSB_SPEED_LOW=1,\
        \ LIBUSB_SPEED_FULL=2, LIBUSB_SPEED_HIGH=3, LIBUSB_SPEED_SUPER=4, LIBUSB_SPEED_SUPER_PLUS=5\
        \ };\nenum libusb_transfer_type { LIBUSB_TRANSFER_TYPE_CONTROL=0, LIBUSB_TRANSFER_TYPE_ISOCHRONOUS=1,\
        \ LIBUSB_TRANSFER_TYPE_BULK=2, LIBUSB_TRANSFER_TYPE_INTERRUPT=3 };\nenum libusb_request_type\
        \ { LIBUSB_REQUEST_TYPE_STANDARD=0, LIBUSB_REQUEST_TYPE_CLASS=1, LIBUSB_REQUEST_TYPE_VENDOR=2,\
        \ LIBUSB_REQUEST_TYPE_RESERVED=3 };\nenum libusb_endpoint_direction { LIBUSB_ENDPOINT_IN=128,\
        \ LIBUSB_ENDPOINT_OUT=0 };\nenum libusb_standard_request { LIBUSB_REQUEST_GET_STATUS=0,\
        \ LIBUSB_REQUEST_CLEAR_FEATURE=1, LIBUSB_REQUEST_SET_FEATURE=3, LIBUSB_REQUEST_SET_ADDRESS=5,\
        \ LIBUSB_REQUEST_GET_DESCRIPTOR=6, LIBUSB_REQUEST_SET_DESCRIPTOR=7, LIBUSB_REQUEST_GET_CONFIGURATION=8,\
        \ LIBUSB_REQUEST_SET_CONFIGURATION=9, LIBUSB_REQUEST_GET_INTERFACE=10, LIBUSB_REQUEST_SET_INTERFACE=11\
        \ };\n\nenum libusb_transfer_status {\n  LIBUSB_TRANSFER_COMPLETED, LIBUSB_TRANSFER_ERROR,\
        \ LIBUSB_TRANSFER_TIMED_OUT,\n  LIBUSB_TRANSFER_CANCELLED, LIBUSB_TRANSFER_STALL,\
        \ LIBUSB_TRANSFER_NO_DEVICE,\n  LIBUSB_TRANSFER_OVERFLOW, LIBUSB_TRANSFER_TYPE_ISOFRAMING_UNDERRUN\n\
        };\n\nstruct libusb_transfer {\n  unsigned char endpoint;\n  unsigned char\
        \ type;\n  unsigned int num_iso_packets;\n  unsigned char *buffer;\n  int\
        \ actual_length;\n  int length;\n  int status;\n  enum libusb_transfer_type\
        \ _type;\n};\n\nstruct libusb_iso_packet_descriptor { unsigned int length;\
        \ unsigned int actual_length; int status; };\n\nstatic inline int libusb_init(void\
        \ **c){(void)c;return 0;}\nstatic inline void libusb_exit(void *c){(void)c;}\n\
        static inline int libusb_get_device_list(void *c, void **l){(void)c;(void)l;return\
        \ 0;}\nstatic inline void libusb_free_device_list(void **l, int u){(void)l;(void)u;}\n\
        static inline int libusb_get_device_descriptor(void *d, void *dd){(void)d;(void)dd;return\
        \ 0;}\nstatic inline int libusb_get_config_descriptor(void *d, int i, void\
        \ **cd){(void)d;(void)i;(void)cd;return 0;}\nstatic inline void libusb_free_config_descriptor(void\
        \ *cd){(void)cd;}\nstatic inline int libusb_open(void *d, void **dh){(void)d;(void)dh;return\
        \ 0;}\nstatic inline void libusb_close(void *dh){(void)dh;}\nstatic inline\
        \ int libusb_claim_interface(void *dh, int i){(void)dh;(void)i;return 0;}\n\
        static inline int libusb_release_interface(void *dh, int i){(void)dh;(void)i;return\
        \ 0;}\nstatic inline int libusb_bulk_transfer(void *dh, unsigned char ep,\
        \ unsigned char *d, int l, int *a, unsigned int t){(void)dh;(void)ep;(void)d;(void)l;(void)a;(void)t;return\
        \ 0;}\nstatic inline int libusb_control_transfer(void *dh, unsigned char rt,\
        \ unsigned char r, unsigned short wv, unsigned short wi, unsigned char *d,\
        \ unsigned short l, unsigned int t){(void)dh;(void)rt;(void)r;(void)wv;(void)wi;(void)d;(void)l;(void)t;return\
        \ 0;}\nstatic inline int libusb_get_string_descriptor_ascii(void *dh, unsigned\
        \ char si, unsigned char *d, int l){(void)dh;(void)si;(void)d;(void)l;return\
        \ 0;}\nstatic inline int libusb_set_interface_alt_setting(void *dh, int i,\
        \ int a){(void)dh;(void)i;(void)a;return 0;}\nstatic inline void libusb_free_transfer(void\
        \ *t){(void)t;}\nstatic inline struct libusb_transfer* libusb_alloc_transfer(int\
        \ i){(void)i;return 0;}\nstatic inline int libusb_submit_transfer(void *t){(void)t;return\
        \ 0;}\nstatic inline int libusb_cancel_transfer(void *t){(void)t;return 0;}\n\
        static inline void libusb_set_pollfd_notifiers(void *c, void *a, void *r){(void)c;(void)a;(void)r;}\n\
        static inline const char* libusb_error_name(int e){(void)e;return \"stub\"\
        ;}\nstatic inline void libusb_setlocale(const char *l){(void)l;}\nstatic inline\
        \ const char* libusb_strerror(int e){(void)e;return \"stub\";}\nLIBUSB_EOF\n\
        echo \"Created libusb.h stub with LIBUSB_CALL and transfer fields\"\n\n# Create\
        \ a stub libusb-1.0/libusb.h too\nmkdir -p \"$APS3E_CPP/ffmpeg_stubs/libusb-1.0\"\
        \ncp \"$APS3E_CPP/ffmpeg_stubs/libusb.h\" \"$APS3E_CPP/ffmpeg_stubs/libusb-1.0/libusb.h\"\
        \necho \"Created libusb-1.0/libusb.h stub\"\n\n# Create stub OpenAL headers\
        \ (OpenAL is disabled on iOS)\ncat > \"$APS3E_CPP/ffmpeg_stubs/alc.h\" <<\
        \ 'ALC_EOF'\n#pragma once\ntypedef void ALCdevice;\ntypedef void ALCcontext;\n\
        typedef int ALCenum;\ntypedef int ALCint;\ntypedef unsigned int ALCuint;\n\
        typedef int ALCsizei;\ntypedef unsigned char ALCboolean;\ntypedef const char*\
        \ ALCstring;\n#define ALC_TRUE 1\n#define ALC_FALSE 0\n#define ALC_NO_ERROR\
        \ 0\n#define ALC_DEVICE_SPECIFIER 0x1005\n#define ALC_ALL_DEVICES_SPECIFIER\
        \ 0x1012\n#define ALC_DEFAULT_DEVICE_SPECIFIER 0x1004\n#define ALC_FREQUENCY\
        \ 0x1007\n#define ALC_REFRESH 0x1008\n#define ALC_SYNC 0x1009\n#define ALC_MONO_SOURCES\
        \ 0x1010\n#define ALC_STEREO_SOURCES 0x1011\nstatic inline ALCdevice* alcOpenDevice(ALCstring\
        \ d){(void)d;return 0;}\nstatic inline ALCboolean alcCloseDevice(ALCdevice\
        \ *d){(void)d;return 1;}\nstatic inline ALCcontext* alcCreateContext(ALCdevice\
        \ *d, const ALCint *a){(void)d;(void)a;return 0;}\nstatic inline ALCboolean\
        \ alcMakeContextCurrent(ALCcontext *c){(void)c;return 1;}\nstatic inline void\
        \ alcDestroyContext(ALCcontext *c){(void)c;}\nstatic inline ALCdevice* alcGetContextsDevice(ALCcontext\
        \ *c){(void)c;return 0;}\nstatic inline ALCenum alcGetError(ALCdevice *d){(void)d;return\
        \ 0;}\nstatic inline ALCboolean alcIsExtensionPresent(ALCdevice *d, ALCstring\
        \ e){(void)d;(void)e;return 0;}\nstatic inline void* alcGetProcAddress(ALCdevice\
        \ *d, ALCstring n){(void)d;(void)n;return 0;}\nstatic inline ALCenum alcGetEnumValue(ALCdevice\
        \ *d, ALCstring n){(void)d;(void)n;return 0;}\nstatic inline void alcGetIntegerv(ALCdevice\
        \ *d, ALCenum p, ALCsizei s, ALCint *v){(void)d;(void)p;(void)s;(void)v;}\n\
        static inline ALCstring alcGetString(ALCdevice *d, ALCenum p){(void)d;(void)p;return\
        \ \"\";}\nstatic inline ALCdevice* alcCaptureOpenDevice(ALCstring d, ALCuint\
        \ f, ALCenum fmt, ALCsizei sz){(void)d;(void)f;(void)fmt;(void)sz;return 0;}\n\
        ALC_EOF\n\ncat > \"$APS3E_CPP/ffmpeg_stubs/al.h\" << 'AL_EOF'\n#pragma once\n\
        typedef int ALenum;\ntypedef int ALint;\ntypedef unsigned int ALuint;\ntypedef\
        \ int ALsizei;\ntypedef unsigned char ALboolean;\ntypedef float ALfloat;\n\
        typedef void ALvoid;\ntypedef unsigned char ALubyte;\ntypedef const char*\
        \ ALstring;\n#define AL_TRUE 1\n#define AL_FALSE 0\n#define AL_NO_ERROR 0\n\
        #define AL_BUFFER 0x1009\n#define AL_FORMAT_MONO16 0x1101\n#define AL_FORMAT_STEREO16\
        \ 0x1103\n#define AL_FREQUENCY 0x1008\n#define AL_BITS 0x100A\n#define AL_CHANNELS\
        \ 0x100B\n#define AL_SIZE 0x100C\n#define AL_SOURCE_STATE 0x1010\n#define\
        \ AL_PLAYING 0x1012\n#define AL_STOPPED 0x1014\n#define AL_GAIN 0x100A\n#define\
        \ AL_POSITION 0x1004\n#define AL_VELOCITY 0x1006\n#define AL_LOOPING 0x1007\n\
        #define AL_SOURCE 0x1027\n#define AL_PITCH 0x1003\n#define AL_REFERENCE_DISTANCE\
        \ 0x1020\n#define AL_MAX_DISTANCE 0x1023\n#define AL_ROLLOFF_FACTOR 0x1021\n\
        static inline void alGenSources(ALsizei n, ALuint *s){(void)n;(void)s;}\n\
        static inline void alDeleteSources(ALsizei n, const ALuint *s){(void)n;(void)s;}\n\
        static inline void alSourcei(ALuint s, ALenum p, ALint v){(void)s;(void)p;(void)v;}\n\
        static inline void alSourcef(ALuint s, ALenum p, ALfloat v){(void)s;(void)p;(void)v;}\n\
        static inline void alSourcePlay(ALuint s){(void)s;}\nstatic inline void alSourcePause(ALuint\
        \ s){(void)s;}\nstatic inline void alSourceStop(ALuint s){(void)s;}\nstatic\
        \ inline void alGetSourcei(ALuint s, ALenum p, ALint *v){(void)s;(void)p;(void)v;}\n\
        static inline void alGenBuffers(ALsizei n, ALuint *b){(void)n;(void)b;}\n\
        static inline void alDeleteBuffers(ALsizei n, const ALuint *b){(void)n;(void)b;}\n\
