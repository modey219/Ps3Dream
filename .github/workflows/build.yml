name: Build Ps3Dream iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install build tools
        run: brew install cmake pkg-config

      - name: Clone rpcs3 core
        run: |
          git clone --depth 1 --recursive https://github.com/RPCS3/rpcs3.git rpcs3_build
          echo "rpcs3 cloned successfully"
          ls rpcs3_build/CMakeLists.txt

      - name: Download MoltenVK pre-built
        run: |
          curl -L -o MoltenVK-ios.tar \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2-rc1/MoltenVK-ios.tar"
          mkdir -p MoltenVK-build
          tar xf MoltenVK-ios.tar -C MoltenVK-build
          find MoltenVK-build -name "libMoltenVK.a" -o -name "MoltenVK.xcframework" 2>/dev/null | head -10

      - name: Prepare source tree
        run: |
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          # Copy rpcs3 root CMakeLists.txt
          cp rpcs3_build/CMakeLists.txt "$APS3E_CPP/rpcs3/CMakeLists.txt"
          
          # Copy rpcs3 core source
          rm -rf "$APS3E_CPP/rpcs3/rpcs3"
          cp -r rpcs3_build/rpcs3 "$APS3E_CPP/rpcs3/rpcs3"
          
          # Copy 3rdparty from rpcs3
          cp -rn rpcs3_build/3rdparty/* "$APS3E_CPP/rpcs3/3rdparty/" 2>/dev/null || true
          
          # Copy buildfiles (ConfigureCompiler.cmake etc.)
          cp -r rpcs3_build/buildfiles "$APS3E_CPP/rpcs3/" 2>/dev/null || true
          
          # Copy all root-level dirs that rpcs3 source may reference
          for d in Utilities darwin; do
            if [ -d "rpcs3_build/$d" ]; then
              cp -r "rpcs3_build/$d" "$APS3E_CPP/rpcs3/"
            fi
          done
          
          # Create stub dirs for missing dependencies
          mkdir -p "$APS3E_CPP/rpcs3/3rdparty/libadrenotools"
          echo "add_library(adrenotools INTERFACE)" > "$APS3E_CPP/rpcs3/3rdparty/libadrenotools/CMakeLists.txt"
          
          mkdir -p "$APS3E_CPP/rpcs3/3rdparty/xxHash/cmake_unofficial"
          cat > "$APS3E_CPP/rpcs3/3rdparty/xxHash/cmake_unofficial/CMakeLists.txt" << 'EOF'
          add_library(xxhash INTERFACE)
          target_include_directories(xxhash INTERFACE ${CMAKE_CURRENT_SOURCE_DIR}/..)
          EOF
          mkdir -p "$APS3E_CPP/rpcs3/3rdparty/xxHash"
          touch "$APS3E_CPP/rpcs3/3rdparty/xxHash/xxhash.h"
          
          # Delete rpcs3's custom FindZLIB.cmake
          rm -f "$APS3E_CPP/rpcs3/buildfiles/cmake/FindZLIB.cmake"
          
          # Create stub ffmpeg headers
          mkdir -p "$APS3E_CPP/ffmpeg_stubs/libavutil" \
                   "$APS3E_CPP/ffmpeg_stubs/libavcodec" \
                   "$APS3E_CPP/ffmpeg_stubs/libavformat" \
                   "$APS3E_CPP/ffmpeg_stubs/libswscale" \
                   "$APS3E_CPP/ffmpeg_stubs/libswresample"
          
          echo '#pragma once' > "$APS3E_CPP/ffmpeg_stubs/libavutil/pixfmt.h"
          echo 'enum AVPixelFormat { AV_PIX_FMT_NONE=-1, AV_PIX_FMT_YUV420P=0, AV_PIX_FMT_YUYV422=1, AV_PIX_FMT_RGB24=2, AV_PIX_FMT_BGR24=3, AV_PIX_FMT_RGBA=26, AV_PIX_FMT_BGRA=28 };' >> "$APS3E_CPP/ffmpeg_stubs/libavutil/pixfmt.h"
          
          echo '#pragma once' > "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo '#include <stdint.h>' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo 'typedef void SwsContext;' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo 'enum { SWS_FAST_BILINEAR=1, SWS_BILINEAR=2, SWS_BICUBIC=4, SWS_POINT=8 };' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo 'static inline SwsContext* sws_getContext(int a,int b,int c,int d,int e,int f,int g,void *h,void *i,void *j){(void)a;(void)b;(void)c;(void)d;(void)e;(void)f;(void)g;(void)h;(void)i;(void)j;return 0;}' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo 'static inline SwsContext* sws_getCachedContext(SwsContext *c,int a,int b,int d,int e,int f,int g,int h,void *i,void *j,void *k){(void)c;(void)a;(void)b;(void)d;(void)e;(void)f;(void)g;(void)h;(void)i;(void)j;(void)k;return 0;}' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo 'static inline int sws_scale(SwsContext *c,const uint8_t *const a[],const int b[],int d,int e,uint8_t *const f[],const int g[]){(void)c;(void)a;(void)b;(void)d;(void)e;(void)f;(void)g;return 0;}' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          echo 'static inline void sws_freeContext(SwsContext *c){(void)c;}' >> "$APS3E_CPP/ffmpeg_stubs/libswscale/swscale.h"
          
          echo '#pragma once' > "$APS3E_CPP/ffmpeg_stubs/libavutil/imgutils.h"
          echo '#include <stdint.h>' >> "$APS3E_CPP/ffmpeg_stubs/libavutil/imgutils.h"
          echo 'static inline int av_image_fill_linesizes(int a[],int b,int c,int d){(void)a;(void)b;(void)c;(void)d;return 0;}' >> "$APS3E_CPP/ffmpeg_stubs/libavutil/imgutils.h"
          echo 'static inline int av_image_fill_pointers(uint8_t *a[],int b,int c,uint8_t *d,const int e[]){(void)a;(void)b;(void)c;(void)d;(void)e;return 0;}' >> "$APS3E_CPP/ffmpeg_stubs/libavutil/imgutils.h"
          
          echo "Created ffmpeg stub headers"
          
          # Create stub libusb.h (comprehensive types needed by rpcs3)
          cat > "$APS3E_CPP/ffmpeg_stubs/libusb.h" << 'LIBUSB_EOF'
          #pragma once
          #include <stdint.h>
          #include <stddef.h>
          #include <stdlib.h>
          #include <sys/time.h>
          #define LIBUSB_API_VERSION 0x01000102
          #define LIBUSB_CALL
          #define LIBUSB_CONTROL_SETUP_SIZE 8
          #define LIBUSB_MAX_ISO_PACKETS 32
          #define LIBUSB_HOTPLUG_MATCH_ANY -1
          #define LIBUSB_REQUEST_TYPE_STANDARD 0
          #define LIBUSB_REQUEST_TYPE_CLASS 0x20
          #define LIBUSB_REQUEST_TYPE_VENDOR 0x40
          #define LIBUSB_REQUEST_TYPE_RESERVED 0xC0
          #define LIBUSB_ENDPOINT_DIR_MASK 0x80
          #define LIBUSB_ENDPOINT_IN 0x80
          #define LIBUSB_ENDPOINT_OUT 0x00
          #define LIBUSB_RECIPIENT_DEVICE 0
          #define LIBUSB_RECIPIENT_INTERFACE 1
          #define LIBUSB_RECIPIENT_ENDPOINT 2
          #define LIBUSB_RECIPIENT_OTHER 3
          #define LIBUSB_REQUEST_SET_CONFIGURATION 9
          struct libusb_context;
          struct libusb_device;
          struct libusb_device_handle;
          struct libusb_device_descriptor {
              unsigned short idVendor;
              unsigned short idProduct;
              unsigned short bcdDevice;
              unsigned char bDeviceClass;
              unsigned char bDeviceSubClass;
              unsigned char bDeviceProtocol;
              unsigned char bNumConfigurations;
              unsigned char bNumEndpoints;
          };
          struct libusb_config_descriptor {
              unsigned short wTotalLength;
              unsigned char bNumInterfaces;
              unsigned char bConfigurationValue;
              unsigned char iConfiguration;
              unsigned char bmAttributes;
              unsigned char MaxPower;
          };
          struct libusb_interface {
              unsigned char num_altsetting;
          };
          struct libusb_endpoint_descriptor {
              unsigned char bEndpointAddress;
              unsigned char bmAttributes;
              unsigned short wMaxPacketSize;
              unsigned char bInterval;
          };
          struct libusb_interface_descriptor {
              unsigned char bInterfaceNumber;
              unsigned char bNumEndpoints;
              unsigned char bInterfaceClass;
          };
          struct libusb_iso_packet_descriptor {
              unsigned int length;
              unsigned int actual_length;
              int status;
          };
          struct libusb_transfer {
              int type;
              int status;
              int actual_length;
              unsigned char *buffer;
              void *user_data;
              int num_iso_packets;
              struct libusb_iso_packet_descriptor iso_packet_desc[LIBUSB_MAX_ISO_PACKETS];
          };
          enum libusb_error { LIBUSB_SUCCESS=0, LIBUSB_ERROR_IO=-1, LIBUSB_ERROR_INVALID_PARAM=-2, LIBUSB_ERROR_ACCESS=-3, LIBUSB_ERROR_NO_DEVICE=-4, LIBUSB_ERROR_NOT_FOUND=-5, LIBUSB_ERROR_BUSY=-6, LIBUSB_ERROR_TIMEOUT=-7, LIBUSB_ERROR_OVERFLOW=-8, LIBUSB_ERROR_PIPE=-9 };
          enum libusb_transfer_type { LIBUSB_TRANSFER_TYPE_CONTROL=0, LIBUSB_TRANSFER_TYPE_ISOCHRONOUS=1, LIBUSB_TRANSFER_TYPE_BULK=2, LIBUSB_TRANSFER_TYPE_INTERRUPT=3 };
          enum libusb_transfer_status { LIBUSB_TRANSFER_COMPLETED=0, LIBUSB_TRANSFER_ERROR=-1, LIBUSB_TRANSFER_TIMED_OUT=-2, LIBUSB_TRANSFER_CANCELLED=-3, LIBUSB_TRANSFER_STALL=-4, LIBUSB_TRANSFER_NO_DEVICE=-5, LIBUSB_TRANSFER_OVERFLOW=-6 };
          enum libusb_log_level { LIBUSB_LOG_LEVEL_ERROR=0, LIBUSB_LOG_LEVEL_WARNING=1, LIBUSB_LOG_LEVEL_INFO=2, LIBUSB_LOG_LEVEL_DEBUG=3 };
          enum libusb_hotplug_event { LIBUSB_HOTPLUG_EVENT_DEVICE_ARRIVED=1, LIBUSB_HOTPLUG_EVENT_DEVICE_LEFT=2 };
          enum libusb_hotplug_flag { LIBUSB_HOTPLUG_NO_EVENTS=0, LIBUSB_HOTPLUG_ENUM_EVENTS=1, LIBUSB_HOTPLUG_ENUM_ALL=2 };
          enum libusb_capability { LIBUSB_CAP_HAS_HOTPLUG=0x0101 };
          enum libusb_option { LIBUSB_OPTION_LOG_LEVEL=0, LIBUSB_OPTION_LOG_CB=1 };
          typedef int libusb_hotplug_callback_handle;
          typedef int (*libusb_hotplug_callback_fn)(libusb_context*, libusb_device*, libusb_hotplug_event, void*);
          typedef void (*libusb_log_cb)(libusb_context*, libusb_log_level, const char*);
          union libusb_init_option_value {
              int ival;
              libusb_log_cb log_cbval;
          };
          struct libusb_init_option {
              enum libusb_option option;
              union libusb_init_option_value value;
          };
          static inline int libusb_init(libusb_context **c){(void)c;return 0;}
          static inline int libusb_init_context(libusb_context **c, struct libusb_init_option *o, int cnt){(void)c;(void)o;(void)cnt;return 0;}
          static inline void libusb_exit(libusb_context *c){(void)c;}
          static inline int libusb_get_device_list(libusb_context *c, libusb_device ***l){(void)c;(void)l;return 0;}
          static inline void libusb_free_device_list(libusb_device **l, int u){(void)l;(void)u;}
          static inline int libusb_get_device_descriptor(libusb_device *d, struct libusb_device_descriptor *dd){(void)d;(void)dd;return 0;}
          static inline int libusb_get_config_descriptor(libusb_device *d, int i, struct libusb_config_descriptor **cd){(void)d;(void)i;(void)cd;return 0;}
          static inline void libusb_free_config_descriptor(struct libusb_config_descriptor *cd){(void)cd;}
          static inline int libusb_open(libusb_device *d, libusb_device_handle **dh){(void)d;(void)dh;return 0;}
          static inline void libusb_close(libusb_device_handle *dh){(void)dh;}
          static inline int libusb_claim_interface(libusb_device_handle *dh, int i){(void)dh;(void)i;return 0;}
          static inline int libusb_release_interface(libusb_device_handle *dh, int i){(void)dh;(void)i;return 0;}
          static inline int libusb_bulk_transfer(libusb_device_handle *dh, unsigned char ep, unsigned char *d, int l, int *a, unsigned int t){(void)dh;(void)ep;(void)d;(void)l;(void)a;(void)t;return 0;}
          static inline int libusb_control_transfer(libusb_device_handle *dh, unsigned char rt, unsigned char r, unsigned short wv, unsigned short wi, unsigned char *d, unsigned short l, unsigned int t){(void)dh;(void)rt;(void)r;(void)wv;(void)wi;(void)d;(void)l;(void)t;return 0;}
          static inline int libusb_get_string_descriptor_ascii(libusb_device_handle *dh, unsigned char si, unsigned char *d, int l){(void)dh;(void)si;(void)d;(void)l;return 0;}
          static inline int libusb_set_interface_alt_setting(libusb_device_handle *dh, int i, int a){(void)dh;(void)i;(void)a;return 0;}
          static inline void libusb_free_transfer(struct libusb_transfer *t){(void)t;}
          static inline struct libusb_transfer* libusb_alloc_transfer(int i){(void)i;return 0;}
          static inline int libusb_submit_transfer(struct libusb_transfer *t){(void)t;return 0;}
          static inline int libusb_cancel_transfer(struct libusb_transfer *t){(void)t;return 0;}
          static inline const char* libusb_error_name(int e){(void)e;return "stub";}
          static inline const char* libusb_strerror(int e){(void)e;return "stub";}
          static inline int libusb_handle_events_timeout_completed(libusb_context *c, struct timeval *tv, int *completed){(void)c;(void)tv;(void)completed;return 0;}
          static inline int libusb_has_capability(unsigned int c){(void)c;return 0;}
          static inline int libusb_hotplug_register_callback(libusb_context *c, int ev, int fl, int vid, int pid, int cls, libusb_hotplug_callback_fn cb, void *ud, libusb_hotplug_callback_handle *h){(void)c;(void)ev;(void)fl;(void)vid;(void)pid;(void)cls;(void)cb;(void)ud;(void)h;return 0;}
          static inline void libusb_hotplug_deregister_callback(libusb_context *c, libusb_hotplug_callback_handle h){(void)c;(void)h;}
          static inline unsigned char libusb_get_port_number(libusb_device *d){(void)d;return 0;}
          static inline unsigned char libusb_get_device_address(libusb_device *d){(void)d;return 0;}
          static inline void libusb_ref_device(libusb_device *d){(void)d;}
          static inline int libusb_set_auto_detach_kernel_driver(libusb_device_handle *dh, int e){(void)dh;(void)e;return 0;}
          LIBUSB_EOF
          
          # Create stub curl header
          mkdir -p "$APS3E_CPP/ffmpeg_stubs/curl"
          cat > "$APS3E_CPP/ffmpeg_stubs/curl/curl.h" << 'CURLEOF'
          #pragma once
          typedef void CURL;
          typedef int CURLcode;
          typedef int CURLoption;
          typedef int CURLINFO;
          typedef void CURLM;
          typedef int CURLMcode;
          typedef int (*curl_write_callback)(char*, size_t, size_t, void*);
          typedef int (*curl_progress_callback)(void*, double, double, double, double);
          enum { CURLE_OK=0, CURLE_FAILED_INIT=-1 };
          enum { CURLOPT_URL=10002, CURLOPT_WRITEFUNCTION=20011, CURLOPT_WRITEDATA=10001, CURLOPT_POSTFIELDS=60, CURLOPT_POST=47, CURLOPT_HTTPHEADER=10023, CURLOPT_SSL_VERIFYPEER=64, CURLOPT_SSL_VERIFYHOST=81, CURLOPT_TIMEOUT=13, CURLOPT_CONNECTTIMEOUT=78, CURLOPT_FOLLOWLOCATION=52, CURLOPT_PROGRESSFUNCTION=20056, CURLOPT_PROGRESSDATA=10057, CURLOPT_NOPROGRESS=43 };
          enum { CURLINFO_RESPONSE_CODE=2097154 };
          static inline CURL* curl_easy_init(void){return 0;}
          static inline void curl_easy_cleanup(CURL* c){(void)c;}
          static inline CURLcode curl_easy_setopt(CURL* c, CURLoption o, ...){(void)c;(void)o;return 0;}
          static inline CURLcode curl_easy_perform(CURL* c){(void)c;return 0;}
          static inline CURLcode curl_easy_getinfo(CURL* c, CURLINFO i, ...){(void)c;(void)i;return 0;}
          static inline const char* curl_easy_strerror(CURLcode c){(void)c;return "stub";}
          struct curl_slist { struct curl_slist *next; char *data; };
          static inline struct curl_slist* curl_slist_append(struct curl_slist *l, const char *s){(void)l;(void)s;return 0;}
          static inline void curl_slist_free_all(struct curl_slist *l){(void)l;}
          static inline CURLM* curl_multi_init(void){return 0;}
          static inline CURLMcode curl_multi_cleanup(CURLM* m){(void)m;return 0;}
          CURLEOF
          mkdir -p "$APS3E_CPP/ffmpeg_stubs/wolfssl"
          cat > "$APS3E_CPP/ffmpeg_stubs/wolfssl/ssl.h" << 'WOLFEOF'
          #pragma once
          typedef struct WOLFSSL WOLFSSL;
          typedef struct WOLFSSL_CTX WOLFSSL_CTX;
          typedef struct WOLFSSL_METHOD WOLFSSL_METHOD;
          WOLFSSL_CTX* wolfSSL_CTX_new(WOLFSSL_METHOD* m){(void)m;return 0;}
          WOLFSSL* wolfSSL_new(WOLFSSL_CTX* c){(void)c;return 0;}
          int wolfSSL_Init(void){return 0;}
          void wolfSSL_Cleanup(void){}
          void wolfSSL_CTX_free(WOLFSSL_CTX* c){(void)c;}
          void wolfSSL_free(WOLFSSL* s){(void)s;}
          int wolfSSL_SetFD(WOLFSSL* s, int fd){(void)s;(void)fd;return 0;}
          int wolfSSL_connect(WOLFSSL* s){(void)s;return 0;}
          int wolfSSL_write(WOLFSSL* s, const void* d, int l){(void)s;(void)d;(void)l;return 0;}
          int wolfSSL_read(WOLFSSL* s, void* d, int l){(void)s;(void)d;(void)l;return 0;}
          int wolfSSL_get_error(WOLFSSL* s, int e){(void)s;(void)e;return 0;}
          const char* wolfSSL_ERR_error_string(unsigned long e){(void)e;return "stub";}
          WOLFSSL_METHOD* wolfTLSv1_2_client_method(void){return 0;}
          WOLFSSL_METHOD* wolfTLSv1_3_client_method(void){return 0;}
          WOLFEOF
          
          mkdir -p "$APS3E_CPP/ffmpeg_stubs/libusb-1.0"
          cp "$APS3E_CPP/ffmpeg_stubs/libusb.h" "$APS3E_CPP/ffmpeg_stubs/libusb-1.0/libusb.h"
          
          # Create stub OpenAL headers
          cat > "$APS3E_CPP/ffmpeg_stubs/al.h" << 'ALEOF'
          #pragma once
          typedef int ALenum;
          typedef int ALint;
          typedef unsigned int ALuint;
          typedef int ALsizei;
          typedef unsigned char ALboolean;
          typedef float ALfloat;
          typedef void ALvoid;
          static inline void alGenSources(ALsizei n,ALuint *s){(void)n;(void)s;}
          static inline void alDeleteSources(ALsizei n,const ALuint *s){(void)n;(void)s;}
          static inline void alSourcei(ALuint s,ALenum p,ALint v){(void)s;(void)p;(void)v;}
          static inline void alSourcef(ALuint s,ALenum p,ALfloat v){(void)s;(void)p;(void)v;}
          static inline void alSourcePlay(ALuint s){(void)s;}
          static inline void alSourceStop(ALuint s){(void)s;}
          static inline void alGetSourcei(ALuint s,ALenum p,ALint *v){(void)s;(void)p;(void)v;}
          static inline void alGenBuffers(ALsizei n,ALuint *b){(void)n;(void)b;}
          static inline void alDeleteBuffers(ALsizei n,const ALuint *b){(void)n;(void)b;}
          static inline void alBufferData(ALuint b,ALenum f,const ALvoid *d,ALsizei s,ALsizei r){(void)b;(void)f;(void)d;(void)s;(void)r;}
          static inline void alGetBufferi(ALuint b,ALenum p,ALint *v){(void)b;(void)p;(void)v;}
          static inline void alListeneri(ALenum p,ALint v){(void)p;(void)v;}
          static inline void alListenerf(ALenum p,ALfloat v){(void)p;(void)v;}
          static inline ALenum alGetError(void){return 0;}
          ALEOF
          
          cat > "$APS3E_CPP/ffmpeg_stubs/alc.h" << 'ALCEOF'
          #pragma once
          typedef void ALCdevice;
          typedef void ALCcontext;
          typedef int ALCenum;
          typedef int ALCint;
          typedef unsigned int ALCuint;
          typedef int ALCsizei;
          typedef unsigned char ALCboolean;
          typedef const char* ALCstring;
          static inline ALCdevice* alcOpenDevice(ALCstring d){(void)d;return 0;}
          static inline ALCboolean alcCloseDevice(ALCdevice *d){(void)d;return 1;}
          static inline ALCcontext* alcCreateContext(ALCdevice *d,const ALCint *a){(void)d;(void)a;return 0;}
          static inline ALCboolean alcMakeContextCurrent(ALCcontext *c){(void)c;return 1;}
          static inline void alcDestroyContext(ALCcontext *c){(void)c;}
          static inline ALCenum alcGetError(ALCdevice *d){(void)d;return 0;}
          ALCEOF
          
          echo '#pragma once' > "$APS3E_CPP/ffmpeg_stubs/alext.h"
          
          # Create stub rtmidi
          cat > "$APS3E_CPP/ffmpeg_stubs/rtmidi_c.h" << 'RTMIDI'
          #pragma once
          struct _RtMidiWrapper;
          typedef struct _RtMidiWrapper* RtMidiInPtr;
          typedef struct _RtMidiWrapper* RtMidiOutPtr;
          static inline RtMidiInPtr rtmidi_in_create_default(void){return 0;}
          static inline void rtmidi_close_in(void *p){(void)p;}
          RTMIDI
          cp "$APS3E_CPP/ffmpeg_stubs/rtmidi_c.h" "$APS3E_CPP/ffmpeg_stubs/rtmidi.h"
          
          # Stub USB source files
          for usbfile in "$APS3E_CPP/rpcs3/rpcs3/Emu/Io/usb_device.cpp" \
                          "$APS3E_CPP/rpcs3/rpcs3/Emu/Io/usb_microphone.cpp" \
                          "$APS3E_CPP/rpcs3/rpcs3/Emu/Io/usb_vfs.cpp"; do
            if [ -f "$usbfile" ]; then
              echo '// Stubbed for iOS' > "$usbfile"
            fi
          done
          
          # Patch libusb os.cmake
          if [ -f "$APS3E_CPP/rpcs3/3rdparty/libusb/os.cmake" ]; then
            sed -i '' 's/message(FATAL_ERROR "Unsupported platform/message(WARNING "Unsupported platform/' "$APS3E_CPP/rpcs3/3rdparty/libusb/os.cmake"
          fi
          
          # Patch Emu/CMakeLists.txt - remove NP sources (need protobuf, curl, wolfssl)
          EMU_CMAKE="$APS3E_CPP/rpcs3/rpcs3/Emu/CMakeLists.txt"
          if [ -f "$EMU_CMAKE" ]; then
            # Remove the entire NP sources block
            sed -i '' '/^# Np$/,/^  )$/{ /^  )$/!d; /^  )$/d; }' "$EMU_CMAKE"
            # Also remove NP-related link libs
            sed -i '' '/3rdparty::wolfssl/d; /3rdparty::protobuf/d; /3rdparty::libcurl/d; /3rdparty::miniupnpc/d' "$EMU_CMAKE"
            # Remove sceNp modules that reference NP headers
            sed -i '' '/sceNp2\.cpp/d; /sceNpClans\.cpp/d; /sceNpCommerce2\.cpp/d; /sceNp\.cpp/d; /sceNpMatchingInt\.cpp/d; /sceNpPlus\.cpp/d; /sceNpSns\.cpp/d; /sceNpTrophy\.cpp/d; /sceNpTus\.cpp/d; /sceNpUtil\.cpp/d; /cellSysutilNpEula\.cpp/d' "$EMU_CMAKE"
            echo "Patched Emu/CMakeLists.txt to remove NP sources"
          fi
          
          # Remove -Werror flags
          for f in "$APS3E_CPP/rpcs3/rpcs3/CMakeLists.txt" "$APS3E_CPP/rpcs3/Utilities/CMakeLists.txt"; do
            if [ -f "$f" ]; then
              sed -i '' 's/-Werror=return-type//g; s/-Werror=old-style-cast//g; s/-Werror=sign-compare//g; s/-Werror=reorder//g; s/-Werror=overloaded-virtual//g; s/-Werror=missing-noreturn//g; s/-Werror=implicit-fallthrough//g' "$f"
            fi
          done
          
          # Patch JIT.h
          if [ -f "$APS3E_CPP/rpcs3/Utilities/JIT.h" ]; then
            TMPJIT=$(mktemp)
            echo '#undef __API_UNAVAILABLE' > "$TMPJIT"
            echo '#define __API_UNAVAILABLE(...)' >> "$TMPJIT"
            echo '#undef __API_UNAVAILABLE_MSG' >> "$TMPJIT"
            echo '#define __API_UNAVAILABLE_MSG(...)' >> "$TMPJIT"
            echo '#pragma clang diagnostic ignored "-Wunguarded-availability-new"' >> "$TMPJIT"
            cat "$APS3E_CPP/rpcs3/Utilities/JIT.h" >> "$TMPJIT"
            mv "$TMPJIT" "$APS3E_CPP/rpcs3/Utilities/JIT.h"
          fi
          
          # Create pthread wrapper
          echo '#pragma once' > "$APS3E_CPP/ffmpeg_stubs/pthread.h"
          echo '#undef __API_UNAVAILABLE' >> "$APS3E_CPP/ffmpeg_stubs/pthread.h"
          echo '#define __API_UNAVAILABLE(...)' >> "$APS3E_CPP/ffmpeg_stubs/pthread.h"
          echo '#undef __API_UNAVAILABLE_MSG' >> "$APS3E_CPP/ffmpeg_stubs/pthread.h"
          echo '#define __API_UNAVAILABLE_MSG(...)' >> "$APS3E_CPP/ffmpeg_stubs/pthread.h"
          echo '#include_next <pthread.h>' >> "$APS3E_CPP/ffmpeg_stubs/pthread.h"
          
          # Patch ConfigureCompiler.cmake
          if [ -f "$APS3E_CPP/rpcs3/buildfiles/cmake/ConfigureCompiler.cmake" ]; then
            sed -i '' 's/-Werror=old-style-cast//g; s/-Werror=sign-compare//g; s/-Werror=reorder//g; s/-Werror=return-type//g; s/-Werror=overloaded-virtual//g; s/-Werror=missing-noreturn//g; s/-Werror=implicit-fallthrough//g; s/-Werror=inconsistent-missing-override//g; s/-Werror=delete-non-virtual-dtor//g' "$APS3E_CPP/rpcs3/buildfiles/cmake/ConfigureCompiler.cmake"
          fi
          
          # Replace 3rdparty/CMakeLists.txt with iOS-compatible version
          THIRDPARTY="$APS3E_CPP/rpcs3/3rdparty/CMakeLists.txt"
          cp "$THIRDPARTY" "${THIRDPARTY}.bak"
