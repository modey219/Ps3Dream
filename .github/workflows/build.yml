    - name: Package IPA
      run: "APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp\n\nmkdir -p Payload/Ps3Dream.app\n\
        \nfind \"$APS3E_CPP/build_ios\" \\( -name \"*.dylib\" -o -name \"*.a\" \\\
        ) \\\n  -path \"*/Release/*\" -exec cp {} Payload/Ps3Dream.app/ \\; 2>/dev/null\
        \ || true\nfind \"$APS3E_CPP/build_ios\" -name \"libps3dream_bridge.dylib\"\
        \ -exec cp {} Payload/Ps3Dream.app/ \\; 2>/dev/null || true\nfind \"$APS3E_CPP/build_ios\"\
        \ -name \"*.dylib\" -exec cp {} Payload/Ps3Dream.app/ \\; 2>/dev/null || true\n\
        \ncp Ps3Dream/Info.plist Payload/Ps3Dream.app/\n\necho \"=== IPA contents\
        \ ===\"\nls -la Payload/Ps3Dream.app/\n\nzip -r -y Ps3Dream.ipa Payload/\n\
        ls -lh Ps3Dream.ipa"
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ps3Dream-iOS-IPA
        path: Ps3Dream.ipa
        retention-days: 30
