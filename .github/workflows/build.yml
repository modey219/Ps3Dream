      - name: Create iOS CMakeLists
        run: |
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          cat > "$APS3E_CPP/CMakeLists.txt" << 'CMAKEEOF'
          cmake_minimum_required(VERSION 3.28)
          project(ps3dream LANGUAGES C CXX OBJCXX)
          
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)
          set(CMAKE_OSX_DEPLOYMENT_TARGET 17.0)
          set(CMAKE_OSX_ARCHITECTURES "arm64")
          
          add_definitions(-DENABLE_JIT=1 -DARCH_ARM64=1 -DUNIX_POSIX=1 -D__APPLE__=1 -DAPPLE=1)
          add_compile_options(-march=armv8-a -stdlib=libc++)
          add_compile_options(-Wno-multichar -Wno-ignored-pragmas -Wno-attributes -Wno-missing-field-initializers -Wno-sign-compare -Wno-unused-parameter -Wno-availability -Wno-deprecated-declarations -Wno-unguarded-availability-new -Wno-error=return-type -Wno-error=old-style-cast -Wno-error=sign-compare -Wno-error=reorder -Wno-error=overloaded-virtual -Wno-error=missing-noreturn -Wno-error=implicit-fallthrough)
          
          set(USE_NATIVE_INSTRUCTIONS OFF CACHE BOOL "" FORCE)
          set(USE_VULKAN OFF CACHE BOOL "" FORCE)
          set(USE_FAUDIO OFF CACHE BOOL "" FORCE)
          set(USE_SDL OFF CACHE BOOL "" FORCE)
          set(USE_LIBEVDEV OFF CACHE BOOL "" FORCE)
          set(USE_LIBUSB OFF CACHE BOOL "" FORCE)
          set(USE_ALSA OFF CACHE BOOL "" FORCE)
          set(USE_PULSE OFF CACHE BOOL "" FORCE)
          set(USE_WOLFSSL OFF CACHE BOOL "" FORCE)
          set(USE_OPENAL OFF CACHE BOOL "" FORCE)
          set(USE_CUBEB OFF CACHE BOOL "" FORCE)
          set(USE_GLLD OFF CACHE BOOL "" FORCE)
          set(USE_FFMPEG OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_GLSLANG OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_FFMPEG OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_LIBUSB OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_CURL OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_ZLIB OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_ZSTD OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_LIBPNG OFF CACHE BOOL "" FORCE)
          set(USE_LIBUPNP OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_FFTW OFF CACHE BOOL "" FORCE)
          set(USE_LLVM OFF CACHE BOOL "" FORCE)
          set(USE_NATIVE_INSTRUCTIONS OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_LIBLZMA OFF CACHE BOOL "" FORCE)
          set(BUILD_LLVM OFF CACHE BOOL "" FORCE)
          set(USE_SYSTEM_BOOST OFF CACHE BOOL "" FORCE)
          set(USE_VULKAN_MEM_ALLOC OFF CACHE BOOL "" FORCE)
          
          include_directories(BEFORE ${CMAKE_CURRENT_SOURCE_DIR}/ffmpeg_stubs)
          include_directories(BEFORE ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/yaml-cpp/yaml-cpp/include)
          include_directories(BEFORE ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/pugixml/src)
          include_directories(BEFORE ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/stblib)
          include_directories(BEFORE ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/flatbuffers/include)
          include_directories(BEFORE ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/SoundTouch/include)
          include_directories(BEFORE ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/zstd/lib)
          include_directories(BEFORE ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/asmjit/src)
          include_directories(BEFORE ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/glslang)
          
          add_subdirectory(rpcs3 EXCLUDE_FROM_ALL)
          
          # Add 3rdparty include dirs directly to rpcs3_emu (include_directories doesn't propagate with Xcode generator)
          target_include_directories(rpcs3_emu PRIVATE
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/yaml-cpp/yaml-cpp/include
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/pugixml/src
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/stblib
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/flatbuffers/include
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/SoundTouch/include
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/zstd/lib
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/asmjit/src
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/glslang
            ${CMAKE_CURRENT_SOURCE_DIR}/rpcs3/3rdparty/libpng
