        \ inline void alListeneri(ALenum p, ALint v){(void)p;(void)v;}\nstatic inline\
        \ void alListenerf(ALenum p, ALfloat v){(void)p;(void)v;}\nstatic inline void\
        \ alListenerfv(ALenum p, const ALfloat *v){(void)p;(void)v;}\nstatic inline\
        \ ALenum alGetError(void){return 0;}\nstatic inline ALboolean alIsExtensionPresent(ALstring\
        \ e){(void)e;return 0;}\nstatic inline void* alGetProcAddress(ALstring n){(void)n;return\
