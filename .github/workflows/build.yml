        \ \\\n  -DIOS=TRUE \\\n  -DANDROID=TRUE \\\n  -DANDROID_PLATFORM_LEVEL=30\
        \ \\\n  -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \\\n  -DCMAKE_OSX_ARCHITECTURES=\"\
        arm64\" \\\n  \"-DCMAKE_C_FLAGS=-D__API_UNAVAILABLE(...)= \" \\\n  \"-DCMAKE_CXX_FLAGS=-D__API_UNAVAILABLE(...)=\
        \ \" \\\n  -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO \\\n  -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=\"\
        \" \\\n  -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \\\n  -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO\
        \ \\\n  -G Xcode\necho \"=== CMake configure done ===\"\ncmake --build . --config\
        \ Release -- \\\n  -sdk iphoneos \\\n  CODE_SIGN_IDENTITY=\"\" \\\n  CODE_SIGNING_REQUIRED=NO\
        \ \\\n  CODE_SIGNING_ALLOWED=NO"
    - name: Package IPA
      run: 'APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp

        mkdir -p Payload/Ps3Dream.app

        find "$APS3E_CPP/build_ios" \( -name "*.dylib" -o -name "*.a" \) -path "*/Release/*"
        -exec cp {} Payload/Ps3Dream.app/ \; 2>/dev/null || true

        find "$APS3E_CPP/build_ios" -name "libps3dream_bridge.dylib" -exec cp {} Payload/Ps3Dream.app/
        \; 2>/dev/null || true

        find "$APS3E_CPP/build_ios" -name "*.dylib" -exec cp {} Payload/Ps3Dream.app/
        \; 2>/dev/null || true

        cp Ps3Dream/Info.plist Payload/Ps3Dream.app/

        zip -r -y Ps3Dream.ipa Payload/

        ls -lh Ps3Dream.ipa'
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Ps3Dream-iOS-IPA
        path: Ps3Dream.ipa
        retention-days: 30
