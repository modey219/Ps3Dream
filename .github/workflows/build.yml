        \ l;}' >> \"$APS3E_CPP/ffmpeg_stubs/wolfssl/ssl.h\"\necho 'static inline int\
        \ wolfSSL_read(WOLFSSL *s, void *b, int l){(void)s;(void)b;(void)l;return\
        \ 0;}' >> \"$APS3E_CPP/ffmpeg_stubs/wolfssl/ssl.h\"\necho 'static inline int\
        \ wolfSSL_shutdown(WOLFSSL *s){(void)s;return 0;}' >> \"$APS3E_CPP/ffmpeg_stubs/wolfssl/ssl.h\"\
        \necho 'static inline int wolfSSL_get_error(WOLFSSL *s, int r){(void)s;(void)r;return\
