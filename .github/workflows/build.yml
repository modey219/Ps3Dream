name: Build Ps3Dream iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install build tools
        run: brew install cmake pkg-config

      - name: Clone rpcs3 core
        run: |
          git clone --depth 1 --recursive https://github.com/RPCS3/rpcs3.git rpcs3_build
          echo "rpcs3 cloned successfully"
          ls rpcs3_build/CMakeLists.txt

      - name: Download MoltenVK pre-built
        run: |
          curl -L -o MoltenVK-ios.tar \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2-rc1/MoltenVK-ios.tar"
          mkdir -p MoltenVK-build
          tar xf MoltenVK-ios.tar -C MoltenVK-build
          find MoltenVK-build -name "libMoltenVK.a" -o -name "MoltenVK.xcframework" 2>/dev/null | head -10

      - name: Prepare source tree
        run: |
          APS3E_CPP=aps3e-extracted/aps3e-2.40/app/src/main/cpp
          
          # Copy rpcs3 root CMakeLists.txt
          cp rpcs3_build/CMakeLists.txt "$APS3E_CPP/rpcs3/CMakeLists.txt"
          
          # Copy rpcs3 core source
          rm -rf "$APS3E_CPP/rpcs3/rpcs3"
          cp -r rpcs3_build/rpcs3 "$APS3E_CPP/rpcs3/rpcs3"
          
          # Copy 3rdparty from rpcs3
          cp -rn rpcs3_build/3rdparty/* "$APS3E_CPP/rpcs3/3rdparty/" 2>/dev/null || true
          
          # Copy buildfiles (ConfigureCompiler.cmake etc.)
          cp -r rpcs3_build/buildfiles "$APS3E_CPP/rpcs3/" 2>/dev/null || true
          
          # Copy all root-level dirs that rpcs3 source may reference
          for d in Utilities darwin; do
            if [ -d "rpcs3_build/$d" ]; then
              cp -r "rpcs3_build/$d" "$APS3E_CPP/rpcs3/"
            fi
          done
          
          # Create stub dirs for missing dependencies
          mkdir -p "$APS3E_CPP/rpcs3/3rdparty/libadrenotools"
          echo "add_library(adrenotools INTERFACE)" > "$APS3E_CPP/rpcs3/3rdparty/libadrenotools/CMakeLists.txt"
          
          mkdir -p "$APS3E_CPP/rpcs3/3rdparty/xxHash/cmake_unofficial"
          cat > "$APS3E_CPP/rpcs3/3rdparty/xxHash/cmake_unofficial/CMakeLists.txt" << 'EOF'
          add_library(xxhash INTERFACE)
          target_include_directories(xxhash INTERFACE ${CMAKE_CURRENT_SOURCE_DIR}/..)
          EOF
          mkdir -p "$APS3E_CPP/rpcs3/3rdparty/xxHash"
          touch "$APS3E_CPP/rpcs3/3rdparty/xxHash/xxhash.h"
          
          # Delete rpcs3's custom FindZLIB.cmake
          rm -f "$APS3E_CPP/rpcs3/buildfiles/cmake/FindZLIB.cmake"
          
          # Create stub ffmpeg headers
          mkdir -p "$APS3E_CPP/ffmpeg_stubs/libavutil" \
                   "$APS3E_CPP/ffmpeg_stubs/libavcodec" \
                   "$APS3E_CPP/ffmpeg_stubs/libavformat" \
                   "$APS3E_CPP/ffmpeg_stubs/libswscale" \
                   "$APS3E_CPP/ffmpeg_stubs/libswresample"
          
          # Comprehensive ffmpeg stub headers - create every commonly used header
          # so we don't play whack-a-mole with missing headers
          for hdr in libavcodec/avcodec.h libavcodec/packet.h libavcodec/version.h \
                     libavformat/avformat.h libavformat/avio.h libavformat/version.h \
                     libavutil/avassert.h libavutil/avstring.h libavutil/bprint.h \
                     libavutil/buffer.h libavutil/channel_layout.h libavutil/common.h \
                     libavutil/cpu.h libavutil/crc.h libavutil/dict.h libavutil/error.h \
                     libavutil/eval.h libavutil/frame.h libavutil/hwcontext.h \
                     libavutil/imgutils.h libavutil/intreadwrite.h libavutil/log.h \
                     libavutil/mathematics.h libavutil/md5.h libavutil/mem.h \
                     libavutil/opt.h libavutil/parse.h libavutil/pixdesc.h \
                     libavutil/pixfmt.h libavutil/rational.h libavutil/samplefmt.h \
                     libavutil/timestamp.h libavutil/version.h \
                     libavutil/mastering_display_metadata.h libavutil/hdr_dynamic_metadata.h \
                     libavutil/film_grain_params.h libavutil/audio_fifo.h \
                     libswscale/swscale.h libswscale/version.h \
                     libswresample/swresample.h libswresample/version.h; do
            mkdir -p "$(dirname "$APS3E_CPP/ffmpeg_stubs/$hdr")"
            echo '#pragma once' > "$APS3E_CPP/ffmpeg_stubs/$hdr"
          done
          
          # Fill in key types/functions that rpcs3 actually uses
          cat >> "$APS3E_CPP/ffmpeg_stubs/libavcodec/avcodec.h" << 'FFTYPES'
