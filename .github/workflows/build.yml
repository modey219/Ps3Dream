            target_link_libraries(ps3dream_native PRIVATE "${MVK_LIB}")
          endif()
          
          # Vulkan headers
          if(EXISTS "${REPO_ROOT}/MoltenVK-build/vulkan_headers")
            target_include_directories(ps3dream_native PRIVATE "${REPO_ROOT}/MoltenVK-build/vulkan_headers")
          elseif(EXISTS "${REPO_ROOT}/MoltenVK-build/Package/Headers")
            target_include_directories(ps3dream_native PRIVATE "${REPO_ROOT}/MoltenVK-build/Package/Headers")
          endif()
          CMAKEEOF

      - name: Build native library
        run: |
          SRC_DIR=build_src
          
          cd "$SRC_DIR"
          rm -rf build_ios
          mkdir build_ios && cd build_ios
          
          # Compute absolute path for ffmpeg stubs
          FFMPEG_STUBS_DIR="$(cd .. && pwd)/ffmpeg_stubs"

          CLANG_BIN="$(brew --prefix llvm@22)/bin"
          LLVM_INSTALL="$GITHUB_WORKSPACE/llvm-ios-install"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          export PATH="$CLANG_BIN:$PATH"

          cmake .. \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DIOS=TRUE \
            -DANDROID=TRUE \
            -DANDROID_PLATFORM_LEVEL=30 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_C_COMPILER="$CLANG_BIN/clang" \
            -DCMAKE_CXX_COMPILER="$CLANG_BIN/clang++" \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios17.0 \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios17.0 \
            "-DCMAKE_C_FLAGS=-I${FFMPEG_STUBS_DIR}" \
            "-DCMAKE_CXX_FLAGS=-I${FFMPEG_STUBS_DIR}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$LLVM_INSTALL/lib/cmake/llvm" \
            -DWITH_LLVM=ON \
            -DBUILD_LLVM=OFF \
            -DSTATIC_LINK_LLVM=ON \
            -DUSE_LTO=OFF \
            -DLLVM_TARGETS_TO_BUILD=AArch64

          cmake --build . -- -j 4

          # Build the 3rdparty static archives that librpcs3_emu.a references but
          # that the static-only build graph does not pull in (the PRIVATE deps of
          # a static library are only needed at the final link).
          cmake --build . --target libzstd_static png_static Fusion yaml-cpp soundtouch asmjit SPIRV -- -j 4
          echo "=== 3rdparty archives ==="
          find . \( -name "libzstd_static.a" -o -name "libpng_static.a" -o -name "libFusion.a" -o -name "libyaml-cpp.a" -o -name "libsoundtouch.a" -o -name "libasmjit.a" -o -name "libSPIRV.a" \) -print

      - name: Build Swift app and package IPA
        run: |
          SRC_DIR=build_src
          
          # Create app bundle structure
          APP_DIR="Payload/Ps3Dream.app"
          mkdir -p "$APP_DIR"
          
          # Copy Info.plist and strip CR (Windows line endings can confuse plist parsers)
          cp Ps3Dream/Info.plist "$APP_DIR/"
          sed -i '' 's/\r$//' "$APP_DIR/Info.plist"
          
          # Copy config database (per-game settings for 2000+ games)
          mkdir -p "$APP_DIR"
          cp Ps3Dream/Resources/config_database.json "$APP_DIR/"
          
          # Copy entitlements
          cp Ps3Dream/Ps3Dream.entitlements "$APP_DIR/"
          sed -i '' 's/\r$//' "$APP_DIR/Ps3Dream.entitlements"
          
          # Find the built static library
          NATIVE_LIB=$(find "$SRC_DIR/build_ios" -name "libps3dream_native.a" -path "*/Release/*" 2>/dev/null | head -1)
          if [ -z "$NATIVE_LIB" ]; then
            NATIVE_LIB=$(find "$SRC_DIR/build_ios" -name "libps3dream_native.a" 2>/dev/null | head -1)
          fi
          
          if [ -n "$NATIVE_LIB" ]; then
            echo "Found native lib: $NATIVE_LIB"
          else
            echo "WARNING: Native lib not found"
          fi
          
          # Collect all include paths for Swift compilation
          SWIFT_FLAGS=""
          INCLUDE_DIRS=(
            "$SRC_DIR"
            "$SRC_DIR/rpcs3"
            "$SRC_DIR/rpcs3/rpcs3"
            "$SRC_DIR/ffmpeg_stubs"
            "Ps3Dream/Platform"
            "Ps3Dream/JIT"
            "Ps3Dream/MoltenVK"
            "Ps3Dream/Bridge"
            "Ps3Dream"
            "Ps3Dream/Emulator"
            "Ps3Dream/UI"
          )
          
          for dir in "${INCLUDE_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              SWIFT_FLAGS="$SWIFT_FLAGS -I$(realpath "$dir")"
            fi
          done
          
          # Find iOS SDK
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $SDK_PATH"

          # The /usr/bin/swiftc macOS CLI stub overrides SDKROOT to the MacOSX SDK,
          # which makes the clang link step use a MacOSX sysroot while targeting
          # iPhone and fail with exit code 1. Use the real toolchain swiftc and
          # pin SDKROOT to the iPhoneOS SDK.
          export SDKROOT="$SDK_PATH"
          SWIFT_BIN="$(xcrun -f swiftc)"
          echo "Swift compiler: $SWIFT_BIN"

          # Compile link-time stubs for symbols that the static libraries
          # reference but that the iOS 17 SDK does not export.
          STUB_DIR="$RUNNER_TEMP/stubs"
          mkdir -p "$STUB_DIR"
          xcrun -sdk iphoneos clang -target arm64-apple-ios17.0 \
            -c Ps3Dream/Platform/ios_jit_stub.c -o "$STUB_DIR/ios_jit_stub.o"
          xcrun -sdk iphoneos clang -target arm64-apple-ios17.0 \
            -c Ps3Dream/Platform/ios_metal_stub.m -o "$STUB_DIR/ios_metal_stub.o"
          xcrun -sdk iphoneos clang++ -target arm64-apple-ios17.0 -std=c++20 \
            -DARCH_ARM64=1 -DLLVM_AVAILABLE -D'__API_UNAVAILABLE(...)=' \
            -I"$SRC_DIR/rpcs3" \
            -I"$SRC_DIR/rpcs3/rpcs3" \
            -I"$SRC_DIR/rpcs3/rpcs3/Utilities" \
            -I"$SRC_DIR/ffmpeg_stubs" \
            -I"$SRC_DIR/rpcs3/3rdparty" \
            -I"$SRC_DIR/rpcs3/3rdparty/asmjit/asmjit/src" \
            -I"$SRC_DIR/rpcs3/3rdparty/yaml-cpp/yaml-cpp/include" \
            -I"$SRC_DIR/rpcs3/3rdparty/pugixml/src" \
            -I"$SRC_DIR/rpcs3/3rdparty/SoundTouch/soundtouch/include" \
            -I"$SRC_DIR/rpcs3/3rdparty/stblib/stb" \
            -I"$SRC_DIR/rpcs3/3rdparty/glslang/glslang" \
            -I"$SRC_DIR/rpcs3/3rdparty/libpng/libpng" \
            -I"$SRC_DIR/rpcs3/3rdparty/VulkanMemoryAllocator/include" \
            -I"$SRC_DIR/rpcs3/3rdparty/zstd/zstd/lib" \
            -I"$GITHUB_WORKSPACE/llvm-ios-install/include" \
            -c Ps3Dream/Platform/ios_link_stub.cpp -o "$STUB_DIR/ios_link_stub.o"
          
          # Collect all static libraries produced by the native build:
          # ps3dream_native (glue) + rpcs3_emu (core) + all 3rdparty libs + LLVM + MoltenVK
          NATIVE_LIBS=$(find "$SRC_DIR/build_ios" -name "*.a" 2>/dev/null | sort -u)
          LLVM_LIBS=$(find "$GITHUB_WORKSPACE/llvm-ios-install/lib" -name "*.a" 2>/dev/null | sort -u)
          if [ -n "$LLVM_LIBS" ]; then
            NATIVE_LIBS="$NATIVE_LIBS
            $LLVM_LIBS"
          fi
          MVK_LIB=$(find MoltenVK-build -name "libMoltenVK.a" 2>/dev/null | head -1)
          if [ -n "$MVK_LIB" ]; then
            NATIVE_LIBS="$NATIVE_LIBS
            $MVK_LIB"
          fi
          echo "=== Static libraries ==="
          echo "$NATIVE_LIBS"

          # Build linker args. Use -force_load for each archive to resolve
          # circular dependencies between rpcs3 and 3rdparty without needing
          # to link each archive twice (Apple ld does not support --allow-multiple-definitions).
          LINK_LIBS=""
          for lib in $NATIVE_LIBS; do
            LINK_LIBS="$LINK_LIBS -Xlinker -force_load -Xlinker $lib"
          done

          # Compile Swift sources
          echo "Compiling Swift sources..."
          "$SWIFT_BIN" \
            -v \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios17.0 \
            -module-name Ps3Dream \
            -import-objc-header Ps3Dream/Ps3Dream-Bridging-Header.h \
            $SWIFT_FLAGS \
            $LINK_LIBS \
            -Xlinker -lc++ \
            -Xlinker -framework -Xlinker Metal \
            -Xlinker -framework -Xlinker MetalKit \
            -Xlinker -framework -Xlinker QuartzCore \
            -Xlinker -framework -Xlinker UIKit \
            -Xlinker -framework -Xlinker Foundation \
            -Xlinker -framework -Xlinker CoreGraphics \
            -Xlinker -framework -Xlinker CoreVideo \
            -Xlinker -framework -Xlinker CoreText \
            -Xlinker -framework -Xlinker ImageIO \
            -Xlinker -framework -Xlinker Security \
            -Xlinker -framework -Xlinker SystemConfiguration \
            -Xlinker -framework -Xlinker AudioToolbox \
            -Xlinker -framework -Xlinker AVFoundation \
            -Xlinker -framework -Xlinker CoreMedia \
            -Xlinker -lsqlite3 \
            -Xlinker -lz \
            -Xlinker -liconv \
            -Xlinker -ObjC \
            -Xlinker -v \
            -Xlinker -t \
            -emit-executable \
            -o "$APP_DIR/Ps3Dream" \
            Ps3Dream/Ps3DreamApp.swift \
            Ps3Dream/UI/GameListViewController.swift \
            Ps3Dream/UI/GameCell.swift \
            Ps3Dream/UI/EmulatorViewController.swift \
            Ps3Dream/UI/VirtualPadOverlay.swift \
            Ps3Dream/UI/SettingsViewController.swift \
            Ps3Dream/Emulator/EmulatorManager.swift \
            Ps3Dream/Emulator/AppSettings.swift \
            Ps3Dream/Emulator/PerGameConfig.swift \
            Ps3Dream/Emulator/MemoryMonitor.swift \
            "$STUB_DIR/ios_jit_stub.o" \
            "$STUB_DIR/ios_metal_stub.o" \
            "$STUB_DIR/ios_link_stub.o"
          test -x "$APP_DIR/Ps3Dream" || { echo "ERROR: Ps3Dream executable was not produced"; exit 1; }
          
          # Create app icon — generate a 1024x1024 PNG using Python and
          # reference it via CFBundleIconFile (works without Xcode asset catalog compilation).
          python3 -c "
          import struct, zlib
          W, H = 1024, 1024
          # Dark blue gradient background with PS3-style curve
          raw = b''
          for y in range(H):
              raw += b'\x00'  # filter byte
              for x in range(W):
                  # Radial gradient: dark blue center to black edges
                  dx, dy = x - W//2, y - H//2
                  dist = (dx*dx + dy*dy) ** 0.5 / (W//2)
                  dist = min(dist, 1.0)
                  r = int(20 * (1 - dist))
                  g = int(40 * (1 - dist))
                  b_val = int(120 * (1 - dist))
                  raw += bytes([r, g, b_val, 255])
          def make_chunk(tag, data):
              c = tag + data
              return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          ihdr = struct.pack('>IIBBBBB', W, H, 8, 6, 0, 0, 0)
          png = b'\x89PNG\r\n\x1a\n'
          png += make_chunk(b'IHDR', ihdr)
          png += make_chunk(b'IDAT', zlib.compress(raw))
          png += make_chunk(b'IEND', b'')
          with open('$APP_DIR/AppIcon.png', 'wb') as f:
              f.write(png)
          print('Generated 1024x1024 AppIcon.png')
          "
          
          echo "=== App bundle contents ==="
          ls -la "$APP_DIR/"
          
          # Do NOT code-sign the bundle — LiveContainer re-signs guest apps
          # using its own certificate.  Ad-hoc signing causes CODESIGNING
          # Invalid Page kills by conflicting with LiveContainer's loader.
          
          # Package IPA
          zip -r -y Ps3Dream.ipa Payload/
          ls -lh Ps3Dream.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ps3Dream-iOS-IPA
          path: Ps3Dream.ipa
          retention-days: 30
